[project]
name = "distribos-ai"
version = "0.1.0"
description = "DistribOS AI — serversiz, offline-first savdo va distribyutsiya tizimi"
requires-python = ">=3.13"
dependencies = [
    "PySide6>=6.9",
    "SQLAlchemy>=2.0.36",
    "alembic>=1.14",
    "pydantic>=2.10",
    "paho-mqtt>=2.1",
    "cryptography>=45",
    "cbor2>=5.6",
    "structlog>=24.4",
    "httpx>=0.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.8",
    "mypy>=1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps/desktop/src/distribos"]

[tool.pytest.ini_options]
testpaths = ["tests", "apps/desktop/tests"]
pythonpath = ["apps/desktop/src"]
# Integratsion sinovlar (`tests/integration/`) Docker talab qiladi va
# sekinroq — kundalik ishlashda o'chiq, CI'da alohida bosqichda
# `pytest -m integration` bilan yoqiladi.
addopts = "-q -m 'not integration'"
markers = [
    "integration: Docker'dagi haqiqiy MQTT broker talab qiladi (sekin)",
]
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error::DeprecationWarning:distribos.*"]

[tool.ruff]
line-length = 100
target-version = "py313"
# Vendor qilingan AETHER-Q yadrosi HECH QACHON formatlanmaydi —
# auditdan o'tgan baytlar o'zgarmasligi kerak (tests/security/test_aetherq_vendor.py).
extend-exclude = ["apps/desktop/src/distribos/aether_q/vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Pul summasidagi ajratgich ATAYLAB uzilmas probel (U+00A0): raqam
# satr oxirida bo'linib ketmasin. Bu chalkashlik emas, talab.
"apps/desktop/src/distribos/domain/formatting.py" = ["RUF001"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "apps/desktop/src"
# Vendor yadrosi tashqi kod sifatida qaraladi.
exclude = "apps/desktop/src/distribos/aether_q/vendor"
