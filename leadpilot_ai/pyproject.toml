[project]
name = "leadpilot-ai"
version = "1.0.0"
description = "AI sales operator and lead management desktop CRM for Windows"
requires-python = ">=3.12"
readme = "README.md"
authors = [{ name = "LeadPilot" }]
dependencies = [
    "PySide6>=6.6,<7",
    "qtawesome>=1.3",
    "SQLAlchemy>=2.0,<3",
    "pydantic>=2.6,<3",
    "httpx>=0.27",
    "openpyxl>=3.1",
    "reportlab>=4.1",
    "bcrypt>=4.1",
    "keyring>=25.0",
    "pypdf>=4.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4", "black>=24.3", "pyinstaller>=6.6"]

[project.scripts]
leadpilot = "app.main:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

# --------------------------------------------------------------------------- #
[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "build", "dist", "logs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "D"]
ignore = [
    "D203",   # conflicts with D211
    "D213",   # conflicts with D212
    "D105",   # magic methods are documented by the class docstring
    "D107",   # __init__ is documented by the class docstring
    "E501",   # line length is handled by black
    "B008",   # FastAPI-style default calls are not used here
    "N818",   # exception names follow the domain vocabulary
    "UP046",  # SQLAlchemy tooling still expects Generic[...] repositories
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D103", "D100"]
"app/ui/*" = ["N802"]  # Qt overrides use camelCase

[tool.ruff.lint.pydocstyle]
convention = "google"

# --------------------------------------------------------------------------- #
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
