[project]
name = "buildcontrol"
version = "1.0.0"
description = "Construction estimate, purchasing and cost control desktop application"
requires-python = ">=3.12"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = [
    "B008",   # Qt APIs use default-argument widgets
    "N802",   # Qt overrides use camelCase
    "N811",   # __version__ re-export in app/__init__.py
    "N818",   # domain exceptions read better without the Error suffix
    "SIM108",
    "UP042",  # str+Enum keeps SQLAlchemy column values plain strings
    "UP046",  # Generic[T] is clearer than PEP 695 syntax for the repository base
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
