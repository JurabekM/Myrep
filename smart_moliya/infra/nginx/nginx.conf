# Smart Moliya - reverse proxy
# Production'da bu konfiguratsiyaga TLS (ssl_certificate) va haqiqiy domen qo'shiladi.

# So'rovlar chastotasini cheklash (rate limiting) - IP bo'yicha
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

upstream backend_upstream {
    server backend:8000;
}

upstream ai_upstream {
    server ai_service:8100;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 5m;

    # Asosiy API
    location /api/ {
        limit_req zone=api_limit burst=40 nodelay;
        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # AI mikroservis - faqat ichki `/ai/` prefiksi orqali
    location /ai/ {
        limit_req zone=api_limit burst=20 nodelay;
        rewrite ^/ai/(.*)$ /$1 break;
        proxy_pass http://ai_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Health check
    location /health {
        proxy_pass http://backend_upstream;
    }

    # Swagger docs (staging'da ochiq, production'da yopish tavsiya etiladi)
    location /docs {
        proxy_pass http://backend_upstream;
    }

    location /openapi.json {
        proxy_pass http://backend_upstream;
    }
}
