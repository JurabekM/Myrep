# Smart Moliya - CI pipeline
# Har push/PR da: backend testlar + AI service testlar + Android build (debug APK)
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Run tests with coverage
        working-directory: backend
        run: pytest

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/htmlcov

  ai-service-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies (CPU-only torch)
        working-directory: ai_service
        run: |
          pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt pytest httpx

      - name: Run tests
        working-directory: ai_service
        run: pytest

  admin-panel-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        working-directory: admin_panel
        run: pip install -r requirements.txt pytest httpx

      - name: Run tests
        working-directory: admin_panel
        run: pytest

  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle wrapper (repo'da binary jar saqlanmaydi)
        working-directory: android
        run: gradle wrapper --gradle-version 8.9

      - name: Run unit tests
        working-directory: android
        run: ./gradlew test

      - name: Build debug APKs (online + offline flavor)
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: smart-moliya-debug-apks
          path: android/app/build/outputs/apk/**/debug/*.apk

  docker-images:
    runs-on: ubuntu-latest
    needs: [backend-tests, ai-service-tests, admin-panel-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -f infra/docker/backend.Dockerfile -t smart-moliya-backend:ci .

      - name: Build AI service image
        run: docker build -f infra/docker/ai_service.Dockerfile -t smart-moliya-ai:ci .

      - name: Build admin panel image
        run: docker build -f infra/docker/admin_panel.Dockerfile -t smart-moliya-admin:ci .

      - name: Smoke test - backend container starts
        run: |
          docker run -d --name smoke -e DATABASE_URL=postgresql+asyncpg://x:x@localhost/x smart-moliya-backend:ci
          sleep 5
          docker logs smoke
          docker rm -f smoke
