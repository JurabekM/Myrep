[workspace]
resolver = "3"
members = [
    "crates/tamga-core",
    "crates/tamga-store",
    "crates/tamga-policy",
    "crates/tamga-redact",
    "crates/tamgad",
    "crates/tamga-hook",
    "crates/tamga-mcp-proxy",
    "crates/tamga-verify",
    "crates/tamga-cli",
    "studio/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
repository = "https://github.com/tamga-dev/tamga"
publish = false

[workspace.dependencies]
tamga-core = { path = "crates/tamga-core" }
tamga-store = { path = "crates/tamga-store" }
tamga-policy = { path = "crates/tamga-policy" }
tamga-redact = { path = "crates/tamga-redact" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
