# Baraka Dastur Desktop — Cargo workspace.
# Yangi crate qo'shishdan oldin sababini docs/CHANGELOG.md da yozing (DESKTOP_PROMPT.md 2-bo'lim).
[workspace]
members = [
  "src-tauri",
  "crates/money",
  "crates/vectors",
  "crates/domain",
  "crates/security",
  "crates/storage",
  "crates/pdf",
]
resolver = "3"

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.97"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
# Production kodda panika va pul uchun float taqiqlanadi (DESKTOP_PROMPT.md 4 va 10-bo'lim).
# Testlarda ruxsat — clippy.toml da.
unwrap_used = "deny"
expect_used = "deny"
float_arithmetic = "deny"
dbg_macro = "deny"
todo = "deny"
