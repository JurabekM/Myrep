name: baraka_daftari
description: "Baraka Dastur — ribosiz shaxsiy moliya ilovasi (MVP-1)."
publish_to: 'none'
version: 1.0.0+5

environment:
  sdk: ^3.8.1
  flutter: 3.32.5

dependencies:
  # SHA-256: kelishuv jurnali xesh-zanjiri (SPEC 2F.6, Vazifa 9A).
  crypto: 3.0.6
  drift: ^2.28.2
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  freezed_annotation: ^3.0.0
  go_router: ^16.0.0
  image_picker: ^1.2.1
  intl: ^0.20.2
  json_annotation: ^4.9.0
  meta: ^1.16.0
  path: ^1.9.1
  path_provider: 2.1.5
  pdf: ^3.11.3
  riverpod_annotation: ^2.6.1
  share_plus: ^12.0.2
  sqlcipher_flutter_libs: ^0.6.8
  sqlite3: ^2.9.4

dev_dependencies:
  build_runner: ^2.4.15
  drift_dev: ^2.28.0
  flutter_test:
    sdk: flutter
  freezed: ^3.0.0
  integration_test:
    sdk: flutter
  json_serializable: ^6.9.0
  mocktail: ^1.0.4
  pigeon: ^26.0.0
  riverpod_generator: ^2.6.0
  very_good_analysis: ^9.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/branding/
    - assets/content/
    - assets/fonts/
  # Noto Sans (SIL OFL 1.1, assets/fonts/OFL.txt): oʻ, gʻ (U+02BB) va ʼ
  # (U+02BC) belgilarini qo'llaydi — tizim Roboto'sida U+02BB yo'q.
  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
        - asset: assets/fonts/NotoSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/NotoSans-Italic.ttf
          style: italic
