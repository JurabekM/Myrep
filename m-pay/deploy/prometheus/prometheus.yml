# Prometheus (2-faza P2.5, ADR-0020): metrikalar va ogohlantirish qoidalari. Dashboard yo'q —
# ogohlantirishlar `GET /api/v1/alerts` va Alertmanager orqali.
# Ogohlantirishlar Alertmanager'ga (deploy/alertmanager/alertmanager.yml) yuboriladi.

global:
  scrape_interval: 10s
  evaluation_interval: 10s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: mpay-api
    static_configs:
      - targets: ["api-1:9464", "api-2:9464"]
  - job_name: mpay-shield
    static_configs:
      - targets: ["shield:9464"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
