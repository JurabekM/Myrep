# Prometheus (2-faza P2.5, ADR-0020): metrikalar va ogohlantirish qoidalari. Dashboard yo'q —
# ogohlantirishlar `GET /api/v1/alerts` va (keyinchalik) Alertmanager orqali.
# TODO(spec): Alertmanager marshruti (bankning navbatchilik kanali) pilot SLA bo'yicha.

global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: mpay-api
    static_configs:
      - targets: ["api-1:9464", "api-2:9464"]
  - job_name: mpay-shield
    static_configs:
      - targets: ["shield:9464"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
