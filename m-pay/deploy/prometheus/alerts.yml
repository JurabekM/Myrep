# M-Pay ogohlantirish qoidalari (2-faza P2.5, ADR-0020). Chegaralar — pilot SLA
# (200 TPS, avtorizatsiya p99 < 300 ms). `severity`: critical — darhol navbatchiga, warning — ish vaqtida.
# Tekshirish: promtool check rules deploy/prometheus/alerts.yml

groups:
  - name: mpay-availability
    rules:
      - alert: MpayInstanceDown
        expr: up{job=~"mpay-api|mpay-shield"} == 0
        for: 30s
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.job }} {{ $labels.instance }} javob bermayapti"
          description: "Metrikalar porti 30 s dan beri ochilmaydi. API bo'lsa nginx qolgan instansiyaga yo'naltiradi; Shield bo'lsa API'lar mahalliy zaxirada (SHIELD_DEGRADED)."

      - alert: MpayApiCapacityReduced
        expr: count(up{job="mpay-api"} == 1) < 2 or absent(up{job="mpay-api"} == 1)
        for: 1m
        labels: { severity: warning }
        annotations:
          summary: "Ishlayotgan API instansiyalari 2 tadan kam"

      - alert: MpayDatabaseDown
        expr: mpay_db_up == 0
        for: 30s
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.instance }}: PostgreSQL javob bermayapti"

  - name: mpay-sla
    rules:
      - alert: MpayAuthorizationLatencyHigh
        expr: |
          histogram_quantile(0.99,
            sum by (le) (rate(mpay_http_request_duration_seconds_bucket{route="/v1/authorizations"}[5m]))
          ) > 0.3
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "Avtorizatsiya p99 {{ $value | humanizeDuration }} — SLA 300 ms dan yuqori"

      - alert: MpayHttp5xxRate
        expr: |
          sum(rate(mpay_http_requests_total{status=~"5.."}[5m]))
            / clamp_min(sum(rate(mpay_http_requests_total[5m])), 1e-9) > 0.01
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "HTTP 5xx ulushi {{ $value | humanizePercentage }} (> 1%)"

      - alert: MpaySystemErrorResponses
        expr: sum(increase(mpay_authorizations_total{code="96"}[5m])) > 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "Avtorizatsiyada 96 (tizim xatosi) javoblari: {{ $value }} ta / 5 daqiqa"
          description: "Emitent javobi o'qilmadi yoki natija noma'lum (qotib qolgan PENDING) — loglar va DB'ni tekshiring."

  - name: mpay-dependencies
    rules:
      - alert: MpayShieldDegraded
        expr: sum(increase(mpay_shield_degraded_total[5m])) > 0
        labels: { severity: warning }
        annotations:
          summary: "Shield roli javob bermadi — qarorlar mahalliy zaxirada ({{ $value }} ta / 5 daqiqa)"

      - alert: MpayOtpDeliveryFailing
        expr: sum(increase(mpay_otp_delivery_failures_total[10m])) > 5
        labels: { severity: warning }
        annotations:
          summary: "OTP SMS yetkazilmayapti ({{ $value }} ta / 10 daqiqa)"

      - alert: MpayDbPoolExhausted
        expr: |
          mpay_db_pool_connections{state="idle"} == 0
            and on (instance) mpay_db_pool_connections{state="busy"} >= on (instance) mpay_db_pool_max_connections
        for: 2m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.instance }}: DB ulanishlar hovuzi to'la"

  - name: mpay-security
    rules:
      - alert: MpayRateLimitSpike
        expr: sum by (kind) (rate(mpay_rate_limited_total[5m])) > 10
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "So'rovlar chegarasi ({{ $labels.kind }}) sekundiga {{ $value }} marta — hujum yoki chegara noto'g'ri"

      - alert: MpayProxyProtocolRejected
        expr: sum(increase(mpay_proxy_protocol_rejected_total[5m])) > 0
        labels: { severity: warning }
        annotations:
          summary: "Ishonchli proksidan yaroqsiz PROXY sarlavhasi — nginx sozlamasini tekshiring"
