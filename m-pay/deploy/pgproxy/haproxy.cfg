# `pg` (ADR-0027): ilovalar PostgreSQL'ga shu orqali ulanadi; ulanish faqat yetakchi tugunga.
# Almashinuvdan keyin (`deploy/pg-failover.sh`) yangi yetakchi 2 s ichida "ko'tariladi", eskisiga
# ochiq ulanishlar uziladi (`on-marked-down shutdown-sessions`) — ilovalar qayta ulanadi.
global
  log stdout format raw local0 notice
  external-check
  insecure-fork-wanted

resolvers docker
  nameserver dns 127.0.0.11:53
  hold valid 2s

defaults
  mode tcp
  log global
  timeout connect 2s
  timeout client 1h
  timeout server 1h

listen pg
  bind :5432
  # Ikki yetakchi ko'rinsa ham (to'siq ishlamagan holat) — faqat birinchisiga.
  balance first
  option external-check
  external-check path "/usr/bin:/bin:/usr/local/bin"
  external-check command /usr/local/bin/pg-primary-check
  default-server check inter 1s fall 2 rise 2 resolvers docker init-addr last,libc,none on-marked-down shutdown-sessions
  server postgres postgres:5432
  server postgres-replica postgres-replica:5432
