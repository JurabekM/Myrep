# M-Pay virtual pilot muhiti (2-faza P2.5, ADR-0020). Dashboard yo'q: HTTP API (nginx orqali),
# CLI va Prometheus ogohlantirishlari.
#
#   bash deploy/init-secrets.sh          # bir marta: tasodifiy sirlar deploy/secrets/ ga (git'ga tushmaydi)
#   docker compose -f deploy/docker-compose.yml up -d --build
#
# Tarkib: PostgreSQL yetakchi + streaming replika (WAL arxivi) va `pg` proksisi (ADR-0027) · bootstrap (bir martalik) · 2 ta Shield roli (yetakchi + zaxira, ADR-0026) ·
# 2 ta API instansiyasi · nginx (L4,
# TLS end-to-end, PROXY protocol) · virtual SMS shlyuzi · Prometheus (+ alerts.yml).
# Host'ga faqat 127.0.0.1:8443 (API) va 127.0.0.1:9090 (Prometheus) ochiladi.

name: mpay

x-mpay: &mpay
  image: ${MPAY_IMAGE:-mpay-server:local}
  build:
    context: ..
    dockerfile: Dockerfile
    target: runtime
  restart: unless-stopped
  stop_grace_period: 15s
  networks: [mpay]
  environment: &mpay-env
    RUST_LOG: ${RUST_LOG:-info}
    MPAY_PKCS11_PIN_FILE: /run/secrets/hsm_pin
    MPAY_PKCS11_SESSIONS: "8"
    MPAY_DATABASE_URL_FILE: /run/secrets/database_url
    MPAY_SHIELD_KEY_FILE: /run/secrets/shield_key
    MPAY_SMS_TOKEN_FILE: /run/secrets/sms_token
  secrets: [hsm_pin, database_url, shield_key, sms_token]

services:
  # Ikki PostgreSQL tuguni (ADR-0027): bir xil `pg-node.sh` — bo'sh papkada yetakchidan nusxa (replika),
  # boshqa yetakchi bo'lsa eski yetakchi ishga tushmaydi (to'siq). WAL arxivi (PITR) umumiy hajmda —
  # almashinuvdan keyin yangi yetakchi ham shu yerga arxivlaydi.
  postgres: &pgnode
    image: postgres:17-alpine
    restart: unless-stopped
    networks: [mpay]
    environment:
      POSTGRES_USER: mpay
      POSTGRES_DB: mpay
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_password
      PG_BOOTSTRAP: primary
      PG_PEERS: postgres-replica
      PG_SLOT: node_postgres
    command: ["sh", "/usr/local/bin/pg-node.sh"]
    secrets: [pg_password, pg_repl_password]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - walarchive:/wal
      - ./postgres/pg-node.sh:/usr/local/bin/pg-node.sh:ro
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "mpay", "-d", "mpay"]
      interval: 2s
      timeout: 3s
      retries: 60

  postgres-replica:
    <<: *pgnode
    environment:
      POSTGRES_USER: mpay
      POSTGRES_DB: mpay
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_password
      PG_PEERS: postgres
      PG_SLOT: node_postgres_replica
    volumes:
      - pgdata-replica:/var/lib/postgresql/data
      - walarchive:/wal
      - ./postgres/pg-node.sh:/usr/local/bin/pg-node.sh:ro
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro

  # Ilovalar bazaga shu orqali (`database_url` → `pg:5432`): faqat yozish uchun ochiq yetakchiga.
  pg:
    image: ${MPAY_PGPROXY_IMAGE:-mpay-pgproxy:local}
    build: ./pgproxy
    restart: unless-stopped
    networks: [mpay]
    secrets: [pg_repl_password]
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "pg-primary-check", "-", "-", "127.0.0.1", "5432"]
      interval: 2s
      timeout: 3s
      retries: 60

  bootstrap:
    <<: *mpay
    restart: "no"
    command: ["mpay-bootstrap"]
    environment:
      <<: *mpay-env
      # PROXY protocol sarlavhasi faqat ikkala nginx'dan (ADR-0027).
      MPAY_LB_IP: "10.88.0.10 10.88.0.11"
    volumes: [state:/var/lib/mpay/state, hsm:/var/lib/mpay/hsm]
    depends_on:
      pg: { condition: service_healthy }

  # Ikkalasi bir xil: DB ijarasini olgani yetakchi, ikkinchisi zaxira (`503 SHIELD_STANDBY`).
  shield: &shield
    <<: *mpay
    command: ["mpay-server", "shield", "--config", "/var/lib/mpay/state/shield.toml"]
    volumes: [state:/var/lib/mpay/state:ro, hsm:/var/lib/mpay/hsm]
    depends_on:
      bootstrap: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "curl", "-sfk", "https://localhost:8600/healthz"]
      interval: 3s
      timeout: 2s
      retries: 20

  shield-2: *shield

  api-1: &api
    <<: *mpay
    volumes: [state:/var/lib/mpay/state:ro, hsm:/var/lib/mpay/hsm]
    depends_on:
      bootstrap: { condition: service_completed_successfully }
      shield: { condition: service_healthy }
      smsgw: { condition: service_started }
    healthcheck:
      test: ["CMD", "curl", "-sfk", "https://localhost:8443/healthz"]
      interval: 3s
      timeout: 2s
      retries: 20

  api-2: *api

  smsgw:
    <<: *mpay
    command: ["mpay-smsgw", "--listen", "0.0.0.0:47700"]
    secrets: [sms_token]
    environment:
      MPAY_SMS_TOKEN_FILE: /run/secrets/sms_token

  # Ikki nginx (ADR-0027) va VRRP (keepalived) bilan umumiy virtual IP 10.88.0.100: biri tushsa VIP
  # ikkinchisiga o'tadi. Ichki mijozlar VIP orqali; host porti — faqat `lb` (sandbox; production'da VIP
  # tashqi tarmoqda yoki bulut balansiri).
  lb: &lb
    image: nginx:1.27.5-alpine
    restart: unless-stopped
    networks:
      mpay: { ipv4_address: 10.88.0.10 }
    ports: ["127.0.0.1:${MPAY_API_PORT:-8443}:8443"]
    volumes: [./nginx/nginx.conf:/etc/nginx/nginx.conf:ro]
    depends_on:
      api-1: { condition: service_healthy }
      api-2: { condition: service_healthy }

  lb-2:
    <<: *lb
    networks:
      mpay: { ipv4_address: 10.88.0.11 }
    ports: []

  # keepalived — nginx konteyneri tarmog'ida (VIP o'sha interfeysga qo'shiladi). nginx konteyneri qayta
  # yaratilsa, yonidagi keepalived ham qayta ishga tushiriladi (`docker compose restart lb-vrrp`).
  lb-vrrp: &vrrp
    image: ${MPAY_KEEPALIVED_IMAGE:-mpay-keepalived:local}
    build: ./keepalived
    restart: unless-stopped
    network_mode: "service:lb"
    cap_add: [NET_ADMIN]
    environment: { VIP: 10.88.0.100, SELF_IP: 10.88.0.10, PEER_IP: 10.88.0.11, PRIORITY: "150" }
    depends_on: [lb]

  lb-2-vrrp:
    <<: *vrrp
    network_mode: "service:lb-2"
    environment: { VIP: 10.88.0.100, SELF_IP: 10.88.0.11, PEER_IP: 10.88.0.10, PRIORITY: "100" }
    depends_on: [lb-2]

  # Ogohlantirishlarni yo'naltirish: sandbox'da virtual navbatchi kanali (smsgw `/alerts`).
  # TODO(spec): bankning navbatchilik kanali (SMS/Telegram/e-pochta/PagerDuty) — alertmanager.yml.
  alertmanager:
    image: prom/alertmanager:v0.34.1
    restart: unless-stopped
    networks: [mpay]
    command: ["--config.file=/etc/alertmanager/alertmanager.yml", "--storage.path=/alertmanager"]
    secrets: [sms_token]
    volumes: [./alertmanager:/etc/alertmanager:ro]
    depends_on:
      smsgw: { condition: service_started }

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    networks: [mpay]
    ports: ["127.0.0.1:${MPAY_PROMETHEUS_PORT:-9090}:9090"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus:/prometheus

networks:
  mpay:
    ipam:
      # Dinamik manzillar .128–.255: statik lb (.10, .11) va VIP (.100) bilan to'qnashmaydi.
      config: [{ subnet: 10.88.0.0/24, ip_range: 10.88.0.128/25 }]

volumes:
  pgdata:
  pgdata-replica:
  walarchive:
  state:
  hsm:
  prometheus:

secrets:
  pg_password: { file: ./secrets/pg_password }
  pg_repl_password: { file: ./secrets/pg_repl_password }
  database_url: { file: ./secrets/database_url }
  hsm_pin: { file: ./secrets/hsm_pin }
  shield_key: { file: ./secrets/shield_key }
  sms_token: { file: ./secrets/sms_token }
