# nginx — L4 (TCP) load balancer (2-faza P2.5, ADR-0020).
#
# TLS bu yerda OCHILMAYDI: shifrlangan oqim API instansiyasiga to'g'ridan-to'g'ri o'tadi, shuning uchun
# server sertifikati pini, terminal mTLS sertifikati va PQ Link (hamyon) o'zgarmaydi. Mijozning
# haqiqiy manzili PROXY protocol v1 sarlavhasida yuboriladi (`[http] proxy_protocol`) — u faqat shu
# konteynerning statik IP'sidan (10.88.0.10) qabul qilinadi.

worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 4096;
}

stream {
    # Docker DNS: instansiya qayta yaratilsa (yangi IP) manzil yangilanadi.
    resolver 127.0.0.11 valid=5s ipv6=off;

    # Faqat ulanish metama'lumotlari — tana (shifrlangan) yozilmaydi.
    log_format l4 '$remote_addr [$time_local] $status $session_time '
                  'in=$bytes_received out=$bytes_sent upstream=$upstream_addr';
    access_log /dev/stdout l4;

    # Mijoz IP'si bo'yicha bir vaqtdagi ulanishlar (ADR-0019 §4): bitta manzil ulanishlar bilan
    # instansiyalarni to'ldirmasin. CGNAT ortida ko'p foydalanuvchi bitta IP'da — qiymat yumshoq;
    # so'rovlar tezligi esa serverda, umumiy omborda (`rate_buckets`) cheklanadi.
    limit_conn_zone $binary_remote_addr zone=perip:10m;
    limit_conn_log_level warn;

    upstream mpay_api {
        zone mpay_api 64k;
        # Sticky routing kerak emas (ADR-0019): sessiyalar umumiy omborda.
        least_conn;
        server api-1:8443 resolve max_fails=1 fail_timeout=10s;
        server api-2:8443 resolve max_fails=1 fail_timeout=10s;
    }

    server {
        listen 8443;
        proxy_pass mpay_api;
        proxy_protocol on;
        limit_conn perip 200;
        # To'xtatilgan instansiya — keyingisiga (ulanish bosqichida, so'rov hali yuborilmagan).
        proxy_connect_timeout 1s;
        proxy_next_upstream on;
        proxy_next_upstream_tries 2;
        proxy_timeout 75s;
    }
}
