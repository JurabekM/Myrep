# Alertmanager (3-faza tayyorgarligi): Prometheus ogohlantirishlarini guruhlab navbatchiga yuboradi.
# Sandbox: virtual navbatchi kanali — mpay-smsgw `POST /alerts` (Bearer token — sms_token secret'i).
# TODO(spec): bankning haqiqiy kanali (SMS shlyuzi, Telegram, e-pochta, PagerDuty) va eskalatsiya.

route:
  receiver: navbatchi
  group_by: [alertname, instance]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 4h
  routes:
    # critical — darhol va tez-tez eslatish; warning — ish vaqti (hozir bitta kanal, TODO(spec)).
    - matchers: ['severity="critical"']
      receiver: navbatchi
      repeat_interval: 30m

receivers:
  - name: navbatchi
    webhook_configs:
      - url: http://smsgw:47700/alerts
        send_resolved: true
        http_config:
          authorization:
            type: Bearer
            credentials_file: /run/secrets/sms_token
