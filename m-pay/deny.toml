# cargo-deny konfiguratsiyasi: litsenziyalar, zaifliklar, taqiqlangan crate'lar, manbalar.
# Ishga tushirish: cargo deny check

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.9
unused-allowed-license = "allow"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
]

# Ichki crate'larimiz nashr qilinmaydi (publish = false).
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    # OpenSSL'ga bog'liqlik — ataylab yo'q (rustls + ring).
    { crate = "openssl-sys", reason = "rustls/ring ishlatiladi" },
    { crate = "native-tls", reason = "rustls/ring ishlatiladi" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
