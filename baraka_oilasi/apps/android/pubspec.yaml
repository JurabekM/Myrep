name: baraka
description: "Baraka — oilaviy moliya daftari (Android)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.0
  flutter: 3.47.6

dependencies:
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  flutter_rust_bridge: 2.13.0
  flutter_svg: ^2.3.0
  go_router: ^18.0.2
  path_provider: ^2.1.6
  share_plus: ^13.3.1

dev_dependencies:
  collection: ^1.19.1
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  mocktail: ^1.0.5
  pigeon: ^26.1.0
  very_good_analysis: ^10.3.0

flutter:
  uses-material-design: true
  assets:
    - lib/l10n/
  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
        - asset: assets/fonts/NotoSans-Bold.ttf
          weight: 700
    - family: NotoSerif
      fonts:
        - asset: assets/fonts/NotoSerif-Regular.ttf
        - asset: assets/fonts/NotoSerif-Bold.ttf
          weight: 700
