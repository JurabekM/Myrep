[package]
name = "baraka-domain"
description = "Baraka Daftari — domen modeli: entitylar, Clock va IdGen traitlari (IO va tasodifiylik yo'q)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# Kod ichida import nomi: `domain`.
[lib]
name = "domain"

[dependencies]
# Pul hisobi (ADR: money crate). Domen qoidalari shu crate orqali summa bilan ishlaydi.
money = { package = "baraka-money", path = "../money" }
# Vaqt qiymatlari (UTC). Joriy vaqtni olish — Clock trait orqali, bu yerda emas.
time = "0.3"
# Xatolar (ADR: thiserror).
thiserror = "2"

[dev-dependencies]
# Testlarda aniq vaqt konstantalari uchun (`datetime!`).
time = { version = "0.3", features = ["macros"] }

[lints]
workspace = true
