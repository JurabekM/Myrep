[package]
name = "baraka-vectors"
description = "Baraka Daftari — umumiy oltin test vektorlari: yuklovchi va runner'lar (DESKTOP_PROMPT.md 5-bo'lim)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# Kod ichida import nomi: `vectors`.
[lib]
name = "vectors"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
# Runner testlari money kutubxonasiga qarshi ishlaydi. money esa bu crate'ga bog'lanmaydi (tsikl yo'q).
money = { package = "baraka-money", path = "../money" }
# D4 suite'lari (streak, income_share, unexplained_gap) domen funksiyalariga qarshi tekshiriladi.
domain = { package = "baraka-domain", path = "../domain" }
time = "0.3"

[lints]
workspace = true
