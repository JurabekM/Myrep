[alembic]
script_location = %(here)s/alembic

# Bu qiymat FAQAT CLI orqali qo'lda migratsiya yozishda ishlatiladi
# (`alembic revision --autogenerate`). Ishlayotgan dastur o'z bazasini
# `distribos.persistence.migrations.ensure_schema()` orqali ulaydi va
# bu yerdagi URL'ni HECH QACHON o'qimaydi — shuning uchun bu haqiqiy
# ma'lumot fayliga ishora QILMAYDI.
sqlalchemy.url = sqlite:///./.alembic-autogen.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
