[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "omborai-desktop"
version = "0.1.0"
description = "OmborAI kassa va ofis ilovasi (Windows/Linux/macOS)"
requires-python = ">=3.12"
dependencies = [
  "PySide6>=6.7",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-qt>=4.4",
  "ruff>=0.6",
  "mypy>=1.11",
]

[project.scripts]
omborai-desktop = "omborai_desktop.__main__:main"

[tool.setuptools.packages.find]
include = ["omborai_desktop*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "E501"]
