name: zanjir_app
description: "ZANJIR — elektrolaboratoriyalar uchun offline-first mobil ilova."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  go_router: ^18.1.1
  intl: ^0.20.3
  qr_flutter: ^4.1.0
  zanjir_core:
    path: ../packages/zanjir_core
  zanjir_data:
    path: ../packages/zanjir_data

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true
  assets:
    # norms/v0.yaml nusxasi — test bilan tenglik tekshiriladi (test/assets_test.dart).
    - assets/norms/
  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
        - asset: assets/fonts/NotoSans-Bold.ttf
          weight: 700
