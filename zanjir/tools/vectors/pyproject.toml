[project]
name = "zanjir-vectors"
version = "0.1.0"
description = "ZANJIR kripto test vektorlari: mustaqil Python implementatsiyasi va generator (ADR-0007)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "cryptography>=43",
]

[dependency-groups]
dev = [
  "mypy>=1.13",
  "pytest>=8.3",
  "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["zanjir_refcrypto"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
