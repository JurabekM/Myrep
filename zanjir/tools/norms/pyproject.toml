[project]
name = "zanjir-norms-check"
version = "0.1.0"
description = "ZANJIR normalar to'plamini tekshirish (schema + release darvozasi)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "jsonschema>=4.23",
  "pyyaml>=6.0.2",
]

[dependency-groups]
dev = [
  "mypy>=1.13",
  "pytest>=8.3",
  "ruff>=0.8",
  "types-jsonschema",
  "types-pyyaml",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"test_*.py" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.12"

[tool.pytest.ini_options]
testpaths = ["."]
