[project]
name = "zanjir-server"
version = "0.1.0"
description = "ZANJIR server: auth, RBAC, sinxronlash, ochiq tekshirish sahifasi"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.14",
  "argon2-cffi>=23.1",
  "asyncpg>=0.30",
  "cryptography>=43",
  "fastapi>=0.115",
  "jinja2>=3.1",
  "prometheus-client>=0.21",
  "pydantic-settings>=2.6",
  "pyjwt>=2.10",
  "pyyaml>=6.0",
  "sqlalchemy[asyncio]>=2.0",
  "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
  "httpx>=0.28",
  "mypy>=1.13",
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "pytest-cov>=6.0",
  "ruff>=0.8",
  "testcontainers[postgres]>=4.9",
  "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["zanjir_server"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "RUF", "ASYNC"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S608"]

[tool.mypy]
strict = true
python_version = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
# starlette TestClient ichki ogohlantirishi (bizning koddan emas)
filterwarnings = ["ignore:Using .httpx. with .starlette.testclient. is deprecated"]

[tool.coverage.run]
# SQLAlchemy async greenlet ichida ishlaydi — usiz qamrov noto'g'ri hisoblanadi.
concurrency = ["greenlet", "thread"]
omit = ["zanjir_server/db/migrations/*"]
