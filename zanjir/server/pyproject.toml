[project]
name = "zanjir-server"
version = "0.1.0"
description = "ZANJIR server: auth, RBAC, sinxronlash, ochiq tekshirish sahifasi"
requires-python = ">=3.12,<3.13"
dependencies = [
  "cryptography>=43",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
  "httpx>=0.28",
  "mypy>=1.13",
  "pytest>=8.3",
  "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["zanjir_server"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "RUF", "ASYNC"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
# starlette TestClient ichki ogohlantirishi (bizning koddan emas)
filterwarnings = ["ignore:Using .httpx. with .starlette.testclient. is deprecated"]
