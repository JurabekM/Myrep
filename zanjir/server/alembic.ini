# Alembic: `uv run alembic upgrade head` (URL — ZANJIR_DATABASE_URL muhit o'zgaruvchisidan, migratsiya egasi roli bilan).
[alembic]
script_location = zanjir_server/db/migrations
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)s %(name)s %(message)s
