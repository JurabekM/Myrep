# Izolyatsiya qarshiligi. Standart: graph tn, ambient_temp_c 20, k_corr 1.0.
# Maydonlar: name, graph, node, type, values, [session], [site], [attrs], [norm_set], [settings]
# Kutilgan: expect (verdict), [norm] (hal qiluvchi norma), [reason], [checks: {norm_id: verdict}]

- name: INS-WIRING — barcha juftliklar normada
  node: CAB1
  type: INSULATION
  values: { test_voltage_v: 1000, pairs: [{ pair: L1-PE, mohm: 120.0 }, { pair: L1-N, mohm: 50.0 }] }
  expect: PASS
  norm: INS-WIRING

- name: INS-WIRING — aynan chegarada (0,5 MΩ) PASS
  node: CAB1
  type: INSULATION
  values: { test_voltage_v: 1000, pairs: [{ pair: L1-PE, mohm: 0.5 }] }
  expect: PASS
  norm: INS-WIRING

- name: INS-WIRING — bitta juftlik pastda → FAIL
  node: CAB1
  type: INSULATION
  values: { test_voltage_v: 1000, pairs: [{ pair: L1-PE, mohm: 120.0 }, { pair: L2-PE, mohm: 0.49 }] }
  expect: FAIL
  norm: INS-WIRING
  reason: out_of_limit

- name: INS-WIRING — asbob kuchlanishi past (500 V) → NEEDS_REVIEW
  node: CAB1
  type: INSULATION
  values: { test_voltage_v: 500, pairs: [{ pair: L1-PE, mohm: 120.0 }] }
  expect: NEEDS_REVIEW
  norm: INS-WIRING
  reason: test_voltage_below_norm

- name: INS-WIRING — yuqoriroq kuchlanish (2500 V) qabul qilinadi
  node: CAB1
  type: INSULATION
  values: { test_voltage_v: 2500, pairs: [{ pair: L1-PE, mohm: 20.0 }] }
  expect: PASS
  norm: INS-WIRING

- name: harorat kiritilmagan → NEEDS_REVIEW
  node: CAB1
  type: INSULATION
  session: { ambient_temp_c: null }
  values: { test_voltage_v: 1000, pairs: [{ pair: L1-PE, mohm: 120.0 }] }
  expect: NEEDS_REVIEW
  reason: missing_ambient_temp

- name: harorat bor, lekin juftlik qiymati yo'q → NEEDS_REVIEW
  node: CAB1
  type: INSULATION
  values: { test_voltage_v: 1000, pairs: [{ pair: L1-PE }] }
  expect: NEEDS_REVIEW
  norm: INS-WIRING
  reason: value_missing

- name: bitta juftlik FAIL, boshqasi yo'q — FAIL ustun
  node: CAB1
  type: INSULATION
  values: { test_voltage_v: 1000, pairs: [{ pair: L1-PE, mohm: 0.1 }, { pair: L2-PE }] }
  expect: FAIL
  norm: INS-WIRING
  reason: out_of_limit

- name: manfiy qiymat → NEEDS_REVIEW
  node: CAB1
  type: INSULATION
  values: { test_voltage_v: 1000, pairs: [{ pair: L1-PE, mohm: -1 }] }
  expect: NEEDS_REVIEW
  reason: invalid_value

- name: juftlik nomi yo'q → NEEDS_REVIEW
  node: CAB1
  type: INSULATION
  values: { test_voltage_v: 1000, pairs: [{ mohm: 100 }] }
  expect: NEEDS_REVIEW
  reason: value_missing

- name: juftliklar bo'sh → NEEDS_REVIEW
  node: CAB1
  type: INSULATION
  values: { test_voltage_v: 1000, pairs: [] }
  expect: NEEDS_REVIEW
  reason: no_pairs

- name: juftliklar ro'yxat emas → NEEDS_REVIEW
  node: CAB1
  type: INSULATION
  values: { test_voltage_v: 1000, pairs: { pair: L1-PE, mohm: 100 } }
  expect: NEEDS_REVIEW
  reason: no_pairs

- name: juftlik elementi xarita emas → NEEDS_REVIEW
  node: CAB1
  type: INSULATION
  values: { test_voltage_v: 1000, pairs: [100] }
  expect: NEEDS_REVIEW
  reason: value_missing

- name: test_voltage_v yo'q → NEEDS_REVIEW
  node: CAB1
  type: INSULATION
  values: { pairs: [{ pair: L1-PE, mohm: 120.0 }] }
  expect: NEEDS_REVIEW
  reason: value_missing

- name: circuit_class yo'q kabel → normani aniqlab bo'lmaydi
  node: CAB1
  type: INSULATION
  attrs: { CAB1: { circuit_class: null } }
  values: { test_voltage_v: 1000, pairs: [{ pair: L1-PE, mohm: 120.0 }] }
  expect: NEEDS_REVIEW
  reason: norm_applicability_unknown

- name: izolyatsiya normasi yo'q tugun (yerga ulagich) → NEEDS_REVIEW
  node: GZ1
  type: INSULATION
  values: { test_voltage_v: 1000, pairs: [{ pair: L1-PE, mohm: 120.0 }] }
  expect: NEEDS_REVIEW
  reason: no_matching_norm

- name: margin_pct 10 — 0,54 < 0,55 → FAIL
  node: CAB1
  type: INSULATION
  norm_set: { margin_pct: 10 }
  values: { test_voltage_v: 1000, pairs: [{ pair: L1-PE, mohm: 0.54 }] }
  expect: FAIL
  norm: INS-WIRING

- name: margin_pct 10 — aynan 0,55 → PASS
  node: CAB1
  type: INSULATION
  norm_set: { margin_pct: 10 }
  values: { test_voltage_v: 1000, pairs: [{ pair: L1-PE, mohm: 0.55 }] }
  expect: PASS
  norm: INS-WIRING

# INS-SWGR ≥ 1,0 MΩ — qabul va ekspluatatsiya uchun bir xil (K1, ADR-0019).
