- name: qo'llanilmaydi deb belgilangan
  node: CAB1
  type: INSULATION
  values: { not_applicable_reason: "Kabel demontaj qilingan" }
  expect: NOT_APPLICABLE
  reason: marked_not_applicable

- name: not_applicable_reason bo'sh → NEEDS_REVIEW
  node: CAB1
  type: INSULATION
  values: { not_applicable_reason: "", test_voltage_v: 1000, pairs: [{ pair: L1-PE, mohm: 120.0 }] }
  expect: NEEDS_REVIEW
  reason: invalid_value

- name: test_voltage_v = 0 → NEEDS_REVIEW
  node: CAB1
  type: INSULATION
  values: { test_voltage_v: 0, pairs: [{ pair: L1-PE, mohm: 120.0 }] }
  expect: NEEDS_REVIEW
  reason: invalid_value

- name: izolyatsiya 0 MΩ (qisqa tutashuv) → FAIL
  node: CAB1
  type: INSULATION
  values: { test_voltage_v: 1000, pairs: [{ pair: L1-PE, mohm: 0 }] }
