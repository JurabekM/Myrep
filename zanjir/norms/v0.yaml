# ZANJIR normalar to'plami v0 (docs/PROMPT.md 5.1, ADR-0002).
# Barcha chegaraviy qiymatlar faqat shu faylda (CLAUDE.md, 4-qoida).
# reviewed_by / reviewed_at — faqat litsenziyali muhandis to'ldiradi (docs/NORMS_REVIEW.md).
# Bo'sh bo'lsa, CI release build'ni yiqitadi.
schema_version: 1
version: "0.1.0"
reviewed_by: ""
reviewed_at: ""
margin_pct: 0

# Sirtmoq: Ia = k · In (avtomatning elektromagnit ajratgich zonasi, ADR-0002 S2).
trip_multipliers:
  B: 5
  C: 10
  D: 20
  source: { doc: "ПУЭ", clause: "1.7.79; ГОСТ IEC 60898-1 (B: 3–5·In, C: 5–10·In, D: 10–20·In, yuqori chegara)" }
  status: needs_verification

norms:
  # --- Izolyatsiya qarshiligi ---
  - id: INS-WIRING
    title: "Elektr simlari izolyatsiyasi, ≤1 kV"
    measurement_type: INSULATION
    applies_to:
      node_kinds: [CABLE]
      u0_volts: { min: 0, max: 1000 }
      attrs: { cable_use: [wiring] }
    test_voltage_v: 1000
    rule: { type: min, value: 0.5 }
    unit: MOhm
    source: { doc: "ПУЭ", clause: "1.8.37, jadval 1.8.34" }
    status: source_seen

  - id: INS-SWGR
    title: "Shitlar va taqsimlash qurilmalari (har seksiya)"
    measurement_type: INSULATION
    applies_to:
      node_kinds: [PANEL, BUSBAR]
      u0_volts: { min: 0, max: 1000 }
    test_voltage_v: 1000
    rule: { type: min, value: 0.5 }
    unit: MOhm
    source: { doc: "ПУЭ", clause: "jadval 1.8.34", note: "Megaommetr 1000–2500 V; pastki chegara 1000 V olingan" }
    status: needs_verification

  - id: INS-SECONDARY
    title: "Ikkilamchi zanjirlar"
    measurement_type: INSULATION
    applies_to:
      node_kinds: [CABLE, PANEL]
      attrs: { circuit_class: [secondary] }
    test_voltage_v: 1000
    rule: { type: min, value: 1.0 }
    unit: MOhm
    source: { doc: "ПУЭ", clause: "jadval 1.8.34" }
    status: needs_verification

  - id: INS-CABLE-LV
    title: "Kuch kabellari, ≤1 kV"
    measurement_type: INSULATION
    applies_to:
      node_kinds: [CABLE]
      u0_volts: { min: 0, max: 1000 }
      attrs: { cable_use: [power] }
    test_voltage_v: 2500
    rule: { type: min, value: 0.5 }
    unit: MOhm
    source: { doc: "ПУЭ", clause: "1.8.40" }
    status: needs_verification

  # --- "Faza-nol" sirtmog'i (TN). Zs_max = k_corr · U0 / Ia ---
  - id: LOOP-TN-FINAL
    title: "TN, oxirgi zanjirlar, U0 = 220 V: t ≤ 0,4 s"
    measurement_type: LOOP_IMPEDANCE
    applies_to:
      node_kinds: [CABLE, SOCKET_GROUP, LOAD, BREAKER, RCBO, FUSE]
      earthing_systems: [TN-C, TN-S, TN-C-S]
      u0_volts: { min: 220, max: 220 }
      attrs: { circuit_role: [final] }
    rule: { type: max_time_ms, value: 400 }
    unit: ms
    source: { doc: "ПУЭ", clause: "1.7.79, jadval 1.7.1" }
    status: source_seen

  - id: LOOP-TN-DIST
    title: "TN, taqsimlovchi zanjirlar: t ≤ 5 s"
    measurement_type: LOOP_IMPEDANCE
    applies_to:
      node_kinds: [CABLE, PANEL, BUSBAR, BREAKER, RCBO, FUSE]
      earthing_systems: [TN-C, TN-S, TN-C-S]
      u0_volts: { min: 0, max: 1000 }
      attrs: { circuit_role: [distribution] }
    rule: { type: max_time_ms, value: 5000 }
    unit: ms
    source: { doc: "ПУЭ", clause: "1.7.79" }
    status: source_seen

  - id: LOOP-TN-OTHER-U0-127
    title: "TN, oxirgi zanjirlar, U0 = 127 V: t ≤ 0,8 s"
    measurement_type: LOOP_IMPEDANCE
    applies_to:
      node_kinds: [CABLE, SOCKET_GROUP, LOAD, BREAKER, RCBO, FUSE]
      earthing_systems: [TN-C, TN-S, TN-C-S]
      u0_volts: { min: 127, max: 127 }
      attrs: { circuit_role: [final] }
    rule: { type: max_time_ms, value: 800 }
    unit: ms
    source: { doc: "ПУЭ", clause: "jadval 1.7.1" }
    status: needs_verification

  - id: LOOP-TN-OTHER-U0-380
    title: "TN, oxirgi zanjirlar, U0 = 380 V: t ≤ 0,2 s"
    measurement_type: LOOP_IMPEDANCE
    applies_to:
      node_kinds: [CABLE, SOCKET_GROUP, LOAD, BREAKER, RCBO, FUSE]
      earthing_systems: [TN-C, TN-S, TN-C-S]
      u0_volts: { min: 380, max: 380 }
      attrs: { circuit_role: [final] }
    rule: { type: max_time_ms, value: 200 }
    unit: ms
    source: { doc: "ПУЭ", clause: "jadval 1.7.1" }
    status: needs_verification

  - id: LOOP-TN-OTHER-U0-GT380
    title: "TN, oxirgi zanjirlar, U0 > 380 V: t ≤ 0,1 s"
    measurement_type: LOOP_IMPEDANCE
    applies_to:
      node_kinds: [CABLE, SOCKET_GROUP, LOAD, BREAKER, RCBO, FUSE]
      earthing_systems: [TN-C, TN-S, TN-C-S]
      u0_volts: { min: 381, max: 1000 }
      attrs: { circuit_role: [final] }
    rule: { type: max_time_ms, value: 100 }
    unit: ms
    source: { doc: "ПУЭ", clause: "jadval 1.7.1" }
    status: needs_verification

  # --- UZO (RCD). selective — UZO atributi, multiplier — o'lchov qiymati ---
  - id: RCD-1X
    title: "Umumiy turdagi UZO, IΔn da: ≤ 300 ms"
    measurement_type: RCD_TRIP
    applies_to:
      node_kinds: [RCD, RCBO]
      attrs: { selective: [false] }
      values: { multiplier: [1.0] }
    rule: { type: max_time_ms, value: 300 }
    unit: ms
    source: { doc: "ГОСТ IEC 61008-1", clause: "o'chish vaqti jadvali" }
    status: needs_verification

  - id: RCD-1X-S
    title: "Selektiv UZO, IΔn da: 130–500 ms"
    measurement_type: RCD_TRIP
    applies_to:
      node_kinds: [RCD, RCBO]
      attrs: { selective: [true] }
      values: { multiplier: [1.0] }
    rule: { type: range, min: 130, max: 500 }
    unit: ms
    source: { doc: "ГОСТ IEC 61008-1", clause: "o'chish vaqti jadvali" }
    status: needs_verification

  - id: RCD-2X
    title: "Umumiy turdagi UZO, 2·IΔn da: ≤ 150 ms"
    measurement_type: RCD_TRIP
    applies_to:
      node_kinds: [RCD, RCBO]
      attrs: { selective: [false] }
      values: { multiplier: [2.0] }
    rule: { type: max_time_ms, value: 150 }
    unit: ms
    source: { doc: "ГОСТ IEC 61008-1", clause: "o'chish vaqti jadvali", note: "ADR-0002 S5 bo'yicha qo'shilgan" }
    status: needs_verification

  - id: RCD-2X-S
    title: "Selektiv UZO, 2·IΔn da: 60–200 ms"
    measurement_type: RCD_TRIP
    applies_to:
      node_kinds: [RCD, RCBO]
      attrs: { selective: [true] }
      values: { multiplier: [2.0] }
    rule: { type: range, min: 60, max: 200 }
    unit: ms
    source: { doc: "ГОСТ IEC 61008-1", clause: "o'chish vaqti jadvali", note: "ADR-0002 S5 bo'yicha qo'shilgan" }
    status: needs_verification

  - id: RCD-5X
    title: "Umumiy turdagi UZO, 5·IΔn da: ≤ 40 ms"
    measurement_type: RCD_TRIP
    applies_to:
      node_kinds: [RCD, RCBO]
      attrs: { selective: [false] }
      values: { multiplier: [5.0] }
    rule: { type: max_time_ms, value: 40 }
    unit: ms
    source: { doc: "ГОСТ IEC 61008-1", clause: "o'chish vaqti jadvali" }
    status: needs_verification

  - id: RCD-5X-S
    title: "Selektiv UZO, 5·IΔn da: 50–150 ms"
    measurement_type: RCD_TRIP
    applies_to:
      node_kinds: [RCD, RCBO]
      attrs: { selective: [true] }
      values: { multiplier: [5.0] }
    rule: { type: range, min: 50, max: 150 }
    unit: ms
    source: { doc: "ГОСТ IEC 61008-1", clause: "o'chish vaqti jadvali", note: "ADR-0002 S5 bo'yicha qo'shilgan" }
    status: needs_verification

  - id: RCD-RAMP
    title: "Differensial o'chish toki: 0,5·IΔn < I ≤ IΔn"
    measurement_type: RCD_TRIP
    applies_to:
      node_kinds: [RCD, RCBO]
      values: { multiplier: [1.0] }
    rule: { type: range, min: 0.5, max: 1.0, min_inclusive: false, max_inclusive: true, relative_to: idn_ma }
    unit: mA
    source: { doc: "ГОСТ IEC 61008-1", clause: "differensial o'chish toki" }
    status: needs_verification

  # --- Yerga ulash qurilmasi. r_ohm × season_coeff ---
  - id: EARTH-NEUTRAL-380
    title: "Neytral yerga ulash qurilmasi, 380/220 V: ≤ 4 Ω"
    measurement_type: EARTH_RESISTANCE
    applies_to:
      node_kinds: [EARTH_ELECTRODE]
      u0_volts: { min: 220, max: 220 }
      attrs: { role: [neutral] }
    rule: { type: max, value: 4.0 }
    unit: Ohm
    source: { doc: "ПУЭ", clause: "1.7.101", note: "Grunt solishtirma qarshiligi ρ > 100 Ω·m bo'lganda oshirish ruxsati qo'llanmagan (konservativ)" }
    status: needs_verification

  - id: EARTH-REPEAT-380-TOTAL
    title: "Takroriy yerga ulash, 380/220 V, jami: ≤ 10 Ω"
    measurement_type: EARTH_RESISTANCE
    applies_to:
      node_kinds: [EARTH_ELECTRODE]
      u0_volts: { min: 220, max: 220 }
      attrs: { role: [repeat] }
      values: { scope: [total] }
    rule: { type: max, value: 10.0 }
    unit: Ohm
    source: { doc: "ПУЭ", clause: "1.7.103", note: "ρ > 100 Ω·m bo'lganda oshirish ruxsati qo'llanmagan (konservativ)" }
    status: needs_verification

  - id: EARTH-REPEAT-380-SINGLE
    title: "Takroriy yerga ulash, 380/220 V, har biri: ≤ 30 Ω"
    measurement_type: EARTH_RESISTANCE
    applies_to:
      node_kinds: [EARTH_ELECTRODE]
      u0_volts: { min: 220, max: 220 }
      attrs: { role: [repeat] }
      values: { scope: [single] }
    rule: { type: max, value: 30.0 }
    unit: Ohm
    source: { doc: "ПУЭ", clause: "1.7.103", note: "ρ > 100 Ω·m bo'lganda oshirish ruxsati qo'llanmagan (konservativ)" }
    status: needs_verification

  - id: EARTH-TT
    title: "TT tizimi: Ra · Ia ≤ 50 V (Ia — yuqoridagi UZO IΔn)"
    measurement_type: EARTH_RESISTANCE
    applies_to:
      node_kinds: [EARTH_ELECTRODE]
      earthing_systems: [TT]
      attrs: { role: [tt] }
    rule: { type: max_product, value: 50.0, factor: upstream_rcd_idn_a }
    unit: V
    source: { doc: "ПУЭ", clause: "1.7.59" }
    status: needs_verification

  # --- Metallik bog'lanish ---
  - id: BOND-CONTACT
    title: "Ulanish (kontakt) qarshiligi: ≤ 0,05 Ω"
    measurement_type: CONTINUITY_BONDING
    applies_to:
      node_kinds: [PE_BAR, EARTH_ELECTRODE, PANEL, BUSBAR, CABLE, LOAD, SOCKET_GROUP]
    rule: { type: max, value: 0.05 }
    unit: Ohm
    source: { doc: "ПТЭЭП", clause: "3-ilova, 26-band" }
    status: source_seen
