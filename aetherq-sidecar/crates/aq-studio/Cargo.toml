[package]
name = "aq-studio"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "AETHER-Q Sidecar Studio — sidecar tunellarini sozlash va boshqarish uchun grafik dastur"

[[bin]]
name = "aq-studio"
path = "src/main.rs"

[dependencies]
aq-core = { path = "../aq-core" }
aq-sidecar = { path = "../aq-sidecar" }
eframe = { version = "0.36", default-features = false, features = ["accesskit", "default_fonts", "glow"] }
egui = "0.36"
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

[dev-dependencies]
# Shrift cmap'ini tekshirish (UI belgilari uchun glif bormi) — egui ichidagi versiya bilan bir xil.
skrifa = "0.44"

[build-dependencies]
winresource = "0.1"
