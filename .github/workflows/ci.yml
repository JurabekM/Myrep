name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: studio/pnpm-lock.yaml
      # tauri::generate_context! frontendDist (studio/dist) ni talab qiladi.
      - run: pnpm install --frozen-lockfile
        working-directory: studio
      - run: pnpm build
        working-directory: studio
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  verify-py:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Mustaqil verifikator: faqat standart kutubxona, spec/test-vectors ga qarshi.
      - run: python -m unittest discover -s tests -v
        working-directory: verify-py
