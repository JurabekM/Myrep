# CI: DESKTOP_PROMPT.md 2-bo'lim — fmt → clippy → test → bindinglar → frontend lint/test → build.
# Asosiy platforma: Windows. macOS va Linux ham tekshiriladi (2- va 3-navbat).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: Frontend (format, lint, typecheck, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - name: "Linux: Tauri tizim kutubxonalari"
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      # Toolchain versiyasi rust-toolchain.toml dan olinadi (1.97.1).
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # tauri::generate_context!() frontendDist (ui/dist) papkasini talab qiladi.
      - run: pnpm -C ui build
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Umumiy pul vektorlari (spec/test-vectors) alohida qadam: qizil bo'lsa, sabab darhol ko'rinadi.
      - name: "Pul vektorlari (spec/test-vectors)"
        run: cargo test -p baraka-vectors
      - run: cargo test --workspace
      # cargo test TypeScript bindinglarini qayta yozadi: git'dagi nusxa bilan farq bo'lsa, build qizil.
      - name: TypeScript bindinglari sinxron
        shell: bash
        run: git diff --exit-code -- ui/src/bindings

  installer:
    name: Windows o'rnatish fayli (NSIS)
    needs: [frontend, rust]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: baraka-dastur-windows-nsis
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error

  coverage:
    name: "Pul moduli qamrovi (95 % dan kam bo'lmasin)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      # money moduli qamrovi kamida 95 % bo'lishi shart (DESKTOP_PROMPT.md, D2 qabul mezonlari).
      - run: cargo llvm-cov -p baraka-money -p baraka-vectors --ignore-filename-regex '(tests|vectors)[\\/]' --fail-under-lines 95 --summary-only
