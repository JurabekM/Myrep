# HavoRadar CI: Kotlin yadro testlari, Flutter analyze/test va APK. Faqat havoradar/ o'zgarganda ishlaydi.
name: havoradar

on:
  push:
    paths: ["havoradar/**", ".github/workflows/havoradar.yml"]
  pull_request:
    paths: ["havoradar/**", ".github/workflows/havoradar.yml"]
  # Haftalik jonli tekshiruv: Open-Meteo javob formati o'zgarmaganmi.
  schedule:
    - cron: "41 3 * * 1"
  workflow_dispatch:

concurrency:
  group: havoradar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: havoradar/engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Yadro testlari (fixture'lar bilan, tarmoqsiz)
        run: ./gradlew test --console=plain
      - name: Flutter fixture'lari yadro chiqishiga mosmi
        run: |
          HAVORADAR_EXPORT=../test/fixtures ./gradlew test --tests '*CodecTest*' --rerun-tasks --console=plain -q
          git diff --exit-code -- ../test/fixtures
      - name: Jonli manba (faqat jadval/qo'lda)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          HAVORADAR_LIVE: "1"
        run: |
          set -o pipefail
          ./gradlew test --tests '*LiveSmokeTest*' --rerun-tasks --console=plain -i | grep -E '^\s+(WEATHER|AIR|Toshkent|Termiz|20[0-9]{2}-)'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: havoradar-engine-tests
          path: havoradar/engine/build/reports/tests/
          if-no-files-found: ignore

  app:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: engine
    defaults:
      run:
        working-directory: havoradar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
        env:
          TZ: Asia/Tashkent
      - name: APK (arm64-v8a, armeabi-v7a, x86_64)
        run: flutter build apk --release --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: havoradar-apk
          path: havoradar/build/app/outputs/flutter-apk/app-*-release.apk

  # Haqiqiy Android emulyatorda (KVM): Kotlin instrumental testlar, Flutter integration_test va
  # foydalanuvchidek ishga tushirish. API 29 — bildirishnoma ruxsatisiz, API 36 — targetSdk.
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: engine
    strategy:
      fail-fast: false
      matrix:
        api-level: [29, 36]
    steps:
      - uses: actions/checkout@v4
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
      - run: flutter pub get
        working-directory: havoradar
      - name: Emulyator testlari
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./havoradar/tool/emulator_test.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: havoradar-emulator-api${{ matrix.api-level }}
          path: |
            havoradar/build/device/
            havoradar/build/app/outputs/androidTest-results/
          if-no-files-found: ignore
