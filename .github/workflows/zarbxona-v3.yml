name: zarbxona-v3

on:
  push:
    paths:
      - "zarbxona_v3/**"
      - ".github/workflows/zarbxona-v3.yml"
  pull_request:
    paths:
      - "zarbxona_v3/**"
      - ".github/workflows/zarbxona-v3.yml"
  workflow_dispatch:

concurrency:
  group: zarbxona-v3-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13"]
    defaults:
      run:
        working-directory: zarbxona_v3
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: zarbxona_v3/requirements.txt

      - name: Qt uchun tizim kutubxonalari (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 fonts-dejavu-core

      - name: Paketlar
        run: python -m pip install -r requirements.txt

      - name: Versiyalar
        run: python -c "import sys, cryptography, PySide6; print(sys.version); print('cryptography', cryptography.__version__, '| PySide6', PySide6.__version__)"

      - name: selftest
        run: python run.py --selftest

      - name: pytest
        run: python -m pytest -q -rs -o faulthandler_timeout=300

  exe:
    name: Windows .exe (PyInstaller)
    needs: test
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: zarbxona_v3
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: zarbxona_v3/requirements.txt

      - name: Paketlar
        run: python -m pip install -r requirements.txt "pyinstaller>=6.10"

      - name: Yig'ish va paketni tekshirish (--version, --selftest)
        run: python tools/exe_yig.py

      - uses: actions/upload-artifact@v4
        with:
          name: Zarbxona-windows
          path: zarbxona_v3/dist/Zarbxona
          if-no-files-found: error
          retention-days: 14
