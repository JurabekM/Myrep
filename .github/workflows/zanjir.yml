# ZANJIR CI (zanjir/docs/DECISIONS.md, ADR-0001/0003/0004). Faqat zanjir/ o'zgarganda ishlaydi.
name: zanjir

on:
  push:
    paths: ["zanjir/**", ".github/workflows/zanjir.yml"]
    # Release: `zanjir-v1.0.0` kabi teg — normalar darvozasi (--release) majburiy.
    tags: ["zanjir-v*"]
  pull_request:
    paths: ["zanjir/**", ".github/workflows/zanjir.yml"]
  workflow_dispatch:

concurrency:
  group: zanjir-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  FLUTTER_VERSION: "3.47.8"

jobs:
  core:
    name: zanjir_core (dart)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zanjir/packages/zanjir_core
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze --fatal-infos
      - name: Testlar + branch coverage
        run: dart run coverage:test_with_coverage --branch-coverage
      - name: Evaluator, solver, crypto — 100% qator va branch coverage
        run: dart run tool/check_coverage.dart

  protocol:
    name: zanjir_protocol (pdf)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zanjir/packages/zanjir_protocol
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: pdftotext (PDF mazmuni testlari uchun)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: PDF matnlari ARB bilan mos (tool/gen_strings.py)
        run: python3 -I tool/gen_strings.py --check
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze --fatal-infos
      - name: Testlar (deterministik PDF — ADR-0010)
        run: dart test

  data:
    name: zanjir_data (drift)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zanjir/packages/zanjir_data
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: dart pub get
      - name: Generatsiya qilingan kod eskirmaganmi (*.g.dart, drift_schemas)
        run: |
          dart run build_runner build
          dart run drift_dev schema generate drift_schemas/zanjir/ test/drift/zanjir/generated/
          dart format lib/src/db/database.g.dart test/drift > /dev/null
          git diff --exit-code -- .
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze --fatal-infos
      - name: Testlar (migratsiya, repozitoriylar, append-only, tashkilotlar, imzolash shartlari)
        run: dart test

  app:
    name: app (flutter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zanjir/app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test integration_test
      - run: flutter analyze --fatal-infos
      - run: flutter test

  server:
    name: server (python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zanjir/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pipx install uv
      - run: uv sync --locked --python 3.12
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy .
      - name: Testlar (PostgreSQL 16 testcontainers, RLS, RBAC matritsasi, sync) + qamrov ≥ 95%
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: uv run pytest --cov=zanjir_server --cov-branch --cov-report=term-missing --cov-fail-under=95
      - name: Kripto vektorlari generatori — lint va tiplar
        run: |
          uv run ruff check ../tools/vectors
          uv run ruff format --check ../tools/vectors
          uv run mypy --strict ../tools/vectors/generate.py
      - name: tools/vectors eskirmaganmi (Dart testlari ham shu fayllarni o'qiydi)
        run: uv run python -I ../tools/vectors/generate.py --check

  e2e:
    name: E2E (ilova sinxronlash ↔ server, ADR-0012)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: zanjir_owner
          # Vaqtinchalik CI konteyneri paroli (maxfiy emas, tashqariga ochilmaydi).
          POSTGRES_PASSWORD: e2e-ci-only
          POSTGRES_DB: zanjir
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U zanjir_owner -d zanjir" --health-interval 2s --health-timeout 2s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pipx install uv
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: dart pub get
        working-directory: zanjir/packages/zanjir_data
      - name: Ikki qurilma, yo'qolgan javob, LWW, buzilgan zanjir, protokol (Dart → FastAPI + PostgreSQL)
        env:
          ZANJIR_E2E_OWNER_URL: postgresql+asyncpg://zanjir_owner:e2e-ci-only@localhost:5432/zanjir
        run: zanjir/tools/e2e/run.sh

  norms:
    name: norms (schema + release darvozasi)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zanjir/tools/norms
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pipx install uv
      - run: uv sync --locked --python 3.12
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy .
      - run: uv run pytest
      - name: Normalarni schema bo'yicha tekshirish
        run: uv run python -I check_norms.py ../../norms
      - name: Release darvozasi — reviewed_by/reviewed_at bo'sh bo'lsa yiqiladi
        if: startsWith(github.ref, 'refs/tags/zanjir-v')
        run: uv run python -I check_norms.py --release ../../norms
