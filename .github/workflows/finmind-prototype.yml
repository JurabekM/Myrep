# FinTx prototipi CI. Faqat finmind_prototype/ o'zgarganda ishlaydi.
# Maqsad: yadro va terminal Windows/macOS/Linux'da, desktop (PySide6) esa
# oynasiz rejimda uchala tizimda ham testdan o'tishini ko'rsatish.
name: finmind-prototype

on:
  push:
    paths: ["finmind_prototype/**", ".github/workflows/finmind-prototype.yml"]
  pull_request:
    paths: ["finmind_prototype/**", ".github/workflows/finmind-prototype.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: finmind-prototype-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: finmind_prototype
    shell: bash

jobs:
  tests:
    name: tests (${{ matrix.os }}, py${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Yadro va terminal testlari (qo'shimcha paketlarsiz)
        run: python -m unittest discover -s tests -t . -v

      - name: "Linux — Qt uchun tizim kutubxonalari"
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: PySide6 o'rnatish
        run: python -m pip install -r requirements-gui.txt

      - name: Desktop testlari (oynasiz rejim)
        run: python -m unittest tests.test_gui -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: ruff (uslub + xavfsizlik qoidalari)
        run: |
          python -m pip install "ruff>=0.6,<1"
          ruff check .
          ruff format --check .
