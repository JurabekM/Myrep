# EpiRadar CI: Kotlin yadro testlari, Flutter analyze/test va APK. Faqat epiradar/ o'zgarganda ishlaydi.
name: epiradar

on:
  push:
    paths: ["epiradar/**", ".github/workflows/epiradar.yml"]
  pull_request:
    paths: ["epiradar/**", ".github/workflows/epiradar.yml"]
  # Haftalik jonli tekshiruv: rasmiy manbalar (WHO, ECDC, CDC, FluNet) formati o'zgarmaganmi.
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

concurrency:
  group: epiradar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: epiradar/engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
      - name: Yadro testlari (fixture'lar bilan, tarmoqsiz)
        run: gradle test --console=plain
      - name: Jonli manbalar (faqat jadval/qo'lda)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          EPIRADAR_LIVE: "1"
        run: |
          set -o pipefail
          gradle test --tests '*LiveSmokeTest*' --rerun-tasks --console=plain -i | grep -E '^\s+(WHO|ECDC|CDC|Shaxsiy|trend|[0-9]+/)'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: epiradar-engine-tests
          path: epiradar/engine/build/reports/tests/
          if-no-files-found: ignore

  app:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: engine
    defaults:
      run:
        working-directory: epiradar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
        env:
          TZ: Asia/Tashkent
      - name: APK (arm64-v8a, armeabi-v7a, x86_64)
        run: flutter build apk --release --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: epiradar-apk
          path: epiradar/build/app/outputs/flutter-apk/app-*-release.apk
