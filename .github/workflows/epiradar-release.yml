# EpiRadar imzolangan reliz: `epiradar-v1.0.1` kabi teg yoki qo'lda (Actions → Run workflow).
# Kalit faqat secret'larda (docs/RELEASE.md): EPIRADAR_UPLOAD_KEYSTORE_B64, EPIRADAR_KEYSTORE_PASSWORD,
# EPIRADAR_KEY_ALIAS, EPIRADAR_KEY_PASSWORD. Kalitsiz yig'ish to'xtaydi (EPIRADAR_REQUIRE_RELEASE_SIGNING).
name: epiradar-release

on:
  push:
    tags: ["epiradar-v*"]
  workflow_dispatch:

concurrency:
  group: epiradar-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: epiradar
    env:
      EPIRADAR_REQUIRE_RELEASE_SIGNING: "1"
      EPIRADAR_KEYSTORE_PASSWORD: ${{ secrets.EPIRADAR_KEYSTORE_PASSWORD }}
      EPIRADAR_KEY_ALIAS: ${{ secrets.EPIRADAR_KEY_ALIAS }}
      EPIRADAR_KEY_PASSWORD: ${{ secrets.EPIRADAR_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
      - name: Yuklash kaliti (secret'dan, faqat runner'da)
        env:
          KEYSTORE_B64: ${{ secrets.EPIRADAR_UPLOAD_KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "EPIRADAR_UPLOAD_KEYSTORE_B64 secret yo'q (docs/RELEASE.md)"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/epiradar-upload.jks"
          echo "EPIRADAR_KEYSTORE_FILE=$RUNNER_TEMP/epiradar-upload.jks" >> "$GITHUB_ENV"
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
        env:
          TZ: Asia/Tashkent
      - name: AAB (Play) va APK (arm64, armv7)
        run: |
          flutter build appbundle --release --obfuscate --split-debug-info=build/symbols
          flutter build apk --release --split-per-abi --target-platform android-arm64,android-arm --obfuscate --split-debug-info=build/symbols
      - name: Imzoni tekshirish
        run: |
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          for f in build/app/outputs/flutter-apk/app-*-release.apk; do
            "$BT/apksigner" verify --print-certs "$f" | tee /dev/stderr | grep -q "CN=Android Debug" && { echo "Debug kalit bilan imzolangan: $f"; exit 1; } || true
          done
          jarsigner -verify build/app/outputs/bundle/release/app-release.aab | tail -1
      - name: Kalitni o'chirish
        if: always()
        run: rm -f "$RUNNER_TEMP/epiradar-upload.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: epiradar-release
          path: |
            epiradar/build/app/outputs/bundle/release/app-release.aab
            epiradar/build/app/outputs/flutter-apk/app-*-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: epiradar-symbols
          path: epiradar/build/symbols
