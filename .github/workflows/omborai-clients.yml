name: omborai-clients

on:
  pull_request:
    paths: ["omborai/desktop/**", "omborai/mobile/**", ".github/workflows/omborai-clients.yml"]
  push:
    branches: [main, "claude/**"]
    paths: ["omborai/desktop/**", "omborai/mobile/**", ".github/workflows/omborai-clients.yml"]

concurrency:
  group: omborai-clients-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  desktop:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: omborai/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: omborai/desktop/pyproject.toml
      - name: Qt uchun tizim kutubxonalari
        run: sudo apt-get update -q && sudo apt-get install -y -q libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Tip tekshiruvi
        run: mypy omborai_desktop --ignore-missing-imports
      - name: Testlar (offscreen Qt)
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q

  mobile:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: omborai/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analiz
        run: flutter analyze
      - name: Testlar
        run: flutter test

  android:
    runs-on: ubuntu-24.04
    needs: mobile
    defaults:
      run:
        working-directory: omborai/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Debug APK yig'ish
        run: flutter build apk --debug
