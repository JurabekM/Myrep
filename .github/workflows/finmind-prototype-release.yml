# FinTx reliz yig'ish: macOS (.dmg, Apple Silicon va Intel) va Windows (Setup.exe).
#
# Qachon ishlaydi:
#   - `fintx-v0.1.0` kabi teg — yig'adi va GitHub Release yaratadi;
#   - qo'lda (workflow_dispatch) yoki paketlash fayllari o'zgarganda — faqat yig'adi,
#     natija shu ishga tushirishning "Artifacts" bo'limida turadi.
#
# Imzolash ixtiyoriy sirlarga (repository secrets) bog'liq. Sir yo'q bo'lsa,
# yig'ish baribir o'tadi, lekin natija ishonchli nashriyotchi imzosisiz bo'ladi:
#   macOS:   FINTX_MACOS_CERT_P12_B64, FINTX_MACOS_CERT_PASSWORD  (Developer ID Application)
#            FINTX_APPLE_ID, FINTX_APPLE_TEAM_ID, FINTX_APPLE_APP_PASSWORD  (notarizatsiya)
#   Windows: FINTX_WINDOWS_CERT_PFX_B64, FINTX_WINDOWS_CERT_PASSWORD  (Authenticode)
# Imzolash qadamlari sertifikat bo'lmagani uchun hali amalda sinalmagan.
name: finmind-prototype-release

on:
  push:
    # `tags` berilganda `branches` ham yozilishi shart: aks holda GitHub branch
    # push'larini bu workflow uchun umuman hisobga olmaydi.
    branches: ["**"]
    paths:
      - "finmind_prototype/packaging/**"
      - ".github/workflows/finmind-prototype-release.yml"
    tags: ["fintx-v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: finmind-prototype-release-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  BUILD_DEPS: '"pyinstaller>=6.10,<7" "pillow>=10"'

jobs:
  macos:
    name: macOS (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-latest, arch: arm64 }
          - { runner: macos-15-intel, arch: x86_64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: finmind_prototype
        shell: bash
    env:
      HAS_CERT: ${{ secrets.FINTX_MACOS_CERT_P12_B64 != '' }}
      HAS_NOTARY: ${{ secrets.FINTX_APPLE_APP_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Bog'liqliklar
        run: |
          python -m pip install -r requirements-gui.txt ${{ env.BUILD_DEPS }}
          VERSION=$(python -c "import fintx; print(fintx.__version__)")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "DMG=FinTx-$VERSION-macOS-${{ matrix.arch }}.dmg" >> "$GITHUB_ENV"

      - name: Developer ID sertifikatini vaqtinchalik keychain'ga yuklash
        if: env.HAS_CERT == 'true'
        env:
          CERT_B64: ${{ secrets.FINTX_MACOS_CERT_P12_B64 }}
          CERT_PASSWORD: ${{ secrets.FINTX_MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/fintx-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 24)
          echo "$CERT_B64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/cert.p12"
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | awk -F'"' '/Developer ID Application/ {print $2; exit}')
          test -n "$IDENTITY" || { echo "::error::Developer ID Application sertifikati topilmadi"; exit 1; }
          echo "MACOS_CODESIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Ilovani yig'ish (PyInstaller)
        run: pyinstaller --noconfirm packaging/fintx.spec

      - name: Arxitektura va imzoni tekshirish
        run: |
          lipo -archs dist/FinTx.app/Contents/MacOS/FinTx | grep -qw "${{ matrix.arch }}"
          codesign --verify --deep --strict --verbose=2 dist/FinTx.app
          codesign -dv dist/FinTx.app 2>&1 | grep -E "Authority|Signature|TeamIdentifier|flags" || true

      - name: Yig'ilgan ilovani sinash
        run: |
          dist/FinTx.app/Contents/MacOS/fintx-cli --self-test
          dist/FinTx.app/Contents/MacOS/FinTx --self-test

      - name: DMG yaratish
        run: |
          STAGE="$RUNNER_TEMP/dmg"
          mkdir -p "$STAGE"
          ditto dist/FinTx.app "$STAGE/FinTx.app"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "FinTx $VERSION" -srcfolder "$STAGE" -ov -format UDZO "dist/$DMG"

      - name: DMG'ni imzolash
        if: env.HAS_CERT == 'true'
        run: codesign --sign "$MACOS_CODESIGN_IDENTITY" --timestamp "dist/$DMG"

      - name: Notarizatsiya (Apple) va chipta biriktirish
        if: env.HAS_CERT == 'true' && env.HAS_NOTARY == 'true'
        env:
          APPLE_ID: ${{ secrets.FINTX_APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.FINTX_APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.FINTX_APPLE_APP_PASSWORD }}
        run: |
          xcrun notarytool submit "dist/$DMG" --wait \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"
          xcrun stapler staple "dist/$DMG"
          spctl --assess --type open --context context:primary-signature --verbose=2 "dist/$DMG"

      - name: DMG ichidagi ilovani sinash
        run: |
          MOUNT="$RUNNER_TEMP/fintx-mount"
          hdiutil attach "dist/$DMG" -nobrowse -readonly -mountpoint "$MOUNT"
          test -L "$MOUNT/Applications"
          "$MOUNT/FinTx.app/Contents/MacOS/FinTx" --self-test
          hdiutil detach "$MOUNT"
          (cd dist && shasum -a 256 "$DMG" > "$DMG.sha256" && cat "$DMG.sha256")

      - name: Imzo holati
        run: |
          if [ "$HAS_CERT" = "true" ]; then
            echo "Imzo: Developer ID ($MACOS_CODESIGN_IDENTITY)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Imzo: faqat ad-hoc (Developer ID sertifikati siri yo'q)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: FinTx-macOS-${{ matrix.arch }}
          path: |
            finmind_prototype/dist/*.dmg
            finmind_prototype/dist/*.sha256
          if-no-files-found: error

  windows:
    name: Windows (x64)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: finmind_prototype
        shell: pwsh
    env:
      HAS_CERT: ${{ secrets.FINTX_WINDOWS_CERT_PFX_B64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Bog'liqliklar
        run: |
          python -m pip install -r requirements-gui.txt ${{ env.BUILD_DEPS }}
          $version = python -c "import fintx; print(fintx.__version__)"
          "VERSION=$version" >> $env:GITHUB_ENV
          "SETUP=FinTx-$version-Windows-Setup.exe" >> $env:GITHUB_ENV

      - name: Ilovani yig'ish (PyInstaller)
        run: pyinstaller --noconfirm packaging/fintx.spec

      - name: Yig'ilgan ilovani sinash
        run: |
          & dist\FinTx\fintx-cli.exe --self-test
          if ($LASTEXITCODE -ne 0) { throw "fintx-cli self-test: $LASTEXITCODE" }
          $gui = Start-Process dist\FinTx\FinTx.exe -ArgumentList "--self-test" -Wait -PassThru
          if ($gui.ExitCode -ne 0) { throw "FinTx.exe self-test: $($gui.ExitCode)" }

      - name: Sertifikatni tayyorlash
        if: env.HAS_CERT == 'true'
        env:
          CERT_B64: ${{ secrets.FINTX_WINDOWS_CERT_PFX_B64 }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "fintx-signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT_B64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe topilmadi" }
          "PFX=$pfx" >> $env:GITHUB_ENV
          "SIGNTOOL=$($signtool.FullName)" >> $env:GITHUB_ENV

      - name: Ijro fayllarni imzolash
        if: env.HAS_CERT == 'true'
        env:
          CERT_PASSWORD: ${{ secrets.FINTX_WINDOWS_CERT_PASSWORD }}
        run: |
          & $env:SIGNTOOL sign /f $env:PFX /p $env:CERT_PASSWORD /fd SHA256 `
            /tr http://timestamp.digicert.com /td SHA256 `
            dist\FinTx\FinTx.exe dist\FinTx\fintx-cli.exe
          if ($LASTEXITCODE -ne 0) { throw "signtool: $LASTEXITCODE" }

      - name: O'rnatuvchini yig'ish (Inno Setup)
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup o'rnatilmadi" }
          }
          & $iscc "/DAppVersion=$env:VERSION" packaging\windows\fintx.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC: $LASTEXITCODE" }
          Get-Item "dist\$env:SETUP" | Format-List Name, Length

      - name: O'rnatuvchini imzolash
        if: env.HAS_CERT == 'true'
        env:
          CERT_PASSWORD: ${{ secrets.FINTX_WINDOWS_CERT_PASSWORD }}
        run: |
          & $env:SIGNTOOL sign /f $env:PFX /p $env:CERT_PASSWORD /fd SHA256 `
            /tr http://timestamp.digicert.com /td SHA256 "dist\$env:SETUP"
          if ($LASTEXITCODE -ne 0) { throw "signtool: $LASTEXITCODE" }
          Remove-Item $env:PFX -Force

      - name: O'rnatish, ishga tushirish va o'chirishni sinash
        run: |
          $target = Join-Path $env:RUNNER_TEMP "FinTx-install"
          $setup = Start-Process "dist\$env:SETUP" -Wait -PassThru -ArgumentList `
            "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$target"
          if ($setup.ExitCode -ne 0) { throw "O'rnatish: $($setup.ExitCode)" }

          & "$target\fintx-cli.exe" --self-test
          if ($LASTEXITCODE -ne 0) { throw "O'rnatilgan fintx-cli: $LASTEXITCODE" }
          $gui = Start-Process "$target\FinTx.exe" -ArgumentList "--self-test" -Wait -PassThru
          if ($gui.ExitCode -ne 0) { throw "O'rnatilgan FinTx.exe: $($gui.ExitCode)" }

          $menu = Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs"
          foreach ($name in "FinTx.lnk", "FinTx (terminal).lnk") {
            if (-not (Test-Path (Join-Path $menu $name))) { throw "Yorliq yo'q: $name" }
          }

          $remove = Start-Process "$target\unins000.exe" -Wait -PassThru -ArgumentList `
            "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART"
          if ($remove.ExitCode -ne 0) { throw "O'chirish: $($remove.ExitCode)" }
          Start-Sleep -Seconds 3
          if (Test-Path "$target\FinTx.exe") { throw "O'chirilgandan keyin fayl qoldi" }
          if (Test-Path (Join-Path $menu "FinTx.lnk")) { throw "O'chirilgandan keyin yorliq qoldi" }

      - name: Nazorat yig'indisi va imzo holati
        run: |
          $hash = (Get-FileHash "dist\$env:SETUP" -Algorithm SHA256).Hash.ToLower()
          "$hash  $env:SETUP" | Set-Content -Encoding ascii "dist\$env:SETUP.sha256"
          Get-Content "dist\$env:SETUP.sha256"
          $status = (Get-AuthenticodeSignature "dist\$env:SETUP").Status
          "Imzo (Authenticode): $status" >> $env:GITHUB_STEP_SUMMARY
          Write-Host "Authenticode: $status"

      - uses: actions/upload-artifact@v4
        with:
          name: FinTx-Windows-x64
          path: |
            finmind_prototype/dist/*-Setup.exe
            finmind_prototype/dist/*.sha256
          if-no-files-found: error

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/fintx-v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Teg va versiya mosligini tekshirish, reliz yaratish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(cd finmind_prototype && python3 -c "import fintx; print(fintx.__version__)")
          test "$GITHUB_REF_NAME" = "fintx-v$VERSION" || {
            echo "::error::Teg ($GITHUB_REF_NAME) va versiya ($VERSION) mos emas"; exit 1; }
          ls -la release
          gh release create "$GITHUB_REF_NAME" release/* \
            --title "FinTx $VERSION" \
            --notes "O'rnatish bo'yicha yo'riqnoma: finmind_prototype/README.md"
