# NetMonitor CI. Faqat netmonitor/ o'zgarganda ishlaydi.
# Windows ishi imzolangan NetMonitor.exe ni yig'adi va artefakt qilib yuklaydi. Imzo — o'zi imzolangan,
# bir martalik kalit bilan: kalit shu ishning o'zida yaratiladi va imzodan keyin o'chiriladi
# (netmonitor/README.md, «Imzo»). Sir (secret) kerak emas.
# windows-live ishi imzolangan exe ni Windows'da haqiqiy ushlash drayveri bilan sinaydi. Npcap'ning
# bepul nashri jim o'rnatilmaydi, shuning uchun u yerda Win10Pcap (WinPcap bilan mos, MSI) ishlatiladi.
name: netmonitor

on:
  push:
    paths: ["netmonitor/**", ".github/workflows/netmonitor.yml"]
  pull_request:
    paths: ["netmonitor/**", ".github/workflows/netmonitor.yml"]
  workflow_dispatch:

concurrency:
  group: netmonitor-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: netmonitor

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Kutubxonalar (xesh bilan)
        run: python -m pip install --disable-pip-version-check --quiet --require-hashes -r requirements-dev.txt
      - name: ruff
        run: python -m ruff check .
      - name: pytest
        run: python -W error::DeprecationWarning -m pytest tests -q -p no:cacheprovider
      - name: O'zini sinash
        run: python netmonitor.py --self-test
      - name: Jonli sinov (haqiqiy interfeysda ushlash)
        run: |
          sudo apt-get install -y -q libpcap-dev > /dev/null
          sudo "$(which python)" tests/live_smoke.py "$(which python)" netmonitor.py

  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: netmonitor
        shell: powershell
    outputs:
      version: ${{ steps.build.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Yig'ish (testlar, PyInstaller, exe ni sinash)
        id: build
        run: .\packaging\build.ps1
      - name: Imzolash (bir martalik o'zi imzolangan sertifikat)
        id: sign
        run: .\packaging\sign.ps1 -Ephemeral
      - name: Imzolangan exe ni tekshirish
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = 'release\NetMonitor.exe'
          $signature = Get-AuthenticodeSignature -FilePath $exe
          $signature | Format-List Status, StatusMessage, @{ n = 'Signer'; e = { $_.SignerCertificate.Subject } }
          if ($signature.SignerCertificate.Thumbprint -ne '${{ steps.sign.outputs.thumbprint }}') { throw 'imzolovchi mos emas' }
          if ($signature.Status -notin @('Valid', 'UnknownError')) { throw "imzo yaroqsiz: $($signature.Status)" }
          if (Test-Path "Cert:\CurrentUser\My\${{ steps.sign.outputs.thumbprint }}") { throw 'kalit o''chirilmagan' }
          & $exe --version
          if ($LASTEXITCODE -ne 0) { throw '--version' }
          & $exe --self-test
          if ($LASTEXITCODE -ne 0) { throw '--self-test' }
          $hash = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne '${{ steps.sign.outputs.sha256 }}') { throw 'SHA-256 mos emas' }
          Get-Content "$exe.sha256"
          Get-ChildItem release | Format-Table Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: NetMonitor-${{ steps.build.outputs.version }}-signed
          path: netmonitor/release/
          if-no-files-found: error

  windows-live:
    needs: windows
    runs-on: windows-latest
    defaults:
      run:
        working-directory: netmonitor
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: NetMonitor-${{ needs.windows.outputs.version }}-signed
          path: netmonitor/release
      - name: Ushlash drayveri (Win10Pcap)
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = Join-Path $env:RUNNER_TEMP 'Win10Pcap.msi'
          Invoke-WebRequest -Uri 'http://www.win10pcap.org/download/Win10Pcap-v10.2-5002.msi' -OutFile $msi
          $hash = (Get-FileHash -LiteralPath $msi -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne 'ce1169c7cac4bc9bc45e159cec069f0ab57c42fc3f636456a2e404cc6b91e855') { throw "MSI xeshi mos emas: $hash" }
          $install = Start-Process msiexec.exe -ArgumentList '/i', "`"$msi`"", '/qn', '/norestart', '/L*v', "`"$env:RUNNER_TEMP\w10pcap.log`"" -Wait -PassThru
          Write-Host "msiexec: $($install.ExitCode)"
          Get-CimInstance Win32_SystemDriver | Where-Object { $_.Name -match 'pcap|npf' } | Format-Table Name, State, StartMode, PathName
          Get-ChildItem "$env:WINDIR\System32\wpcap.dll", "$env:WINDIR\System32\Packet.dll" | Format-Table Name, Length
          if ($install.ExitCode -notin @(0, 3010)) { Get-Content "$env:RUNNER_TEMP\w10pcap.log" -Tail 60; throw 'drayver o''rnatilmadi' }
      - name: Interfeyslar
        run: |
          python -m pip install --disable-pip-version-check --quiet --require-hashes -r requirements.txt
          python -c "from scapy.all import conf; print(conf.use_pcap, conf.use_npcap); print(dict(conf.cache_pcapiflist)); print(conf.ifaces)"
          .\release\NetMonitor.exe --list-ifaces
          if ($LASTEXITCODE -ne 0) { throw '--list-ifaces' }
      - name: Jonli sinov — avto rejim
        run: |
          python tests\live_smoke.py release\NetMonitor.exe
          if ($LASTEXITCODE -ne 0) { throw 'jonli sinov (avto)' }
      - name: Jonli sinov — oddiy rejim
        env:
          NETMONITOR_SMOKE_PROMISCUOUS: "false"
        run: |
          python tests\live_smoke.py release\NetMonitor.exe
          if ($LASTEXITCODE -ne 0) { throw 'jonli sinov (oddiy)' }
      - name: Jonli sinov — promiscuous rejim
        env:
          NETMONITOR_SMOKE_PROMISCUOUS: "true"
        run: |
          python tests\live_smoke.py release\NetMonitor.exe
          if ($LASTEXITCODE -ne 0) { throw 'jonli sinov (promiscuous)' }
