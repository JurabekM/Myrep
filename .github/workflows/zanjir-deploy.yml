# ZANJIR — deploy to'plami (11-faza, ADR-0015): skriptlar lint, compose konfiguratsiyasi va staging qabul sinovi
# (bitta buyruq bilan ko'tarish, HTTPS smoke, E2E TLS orqali, shifrlangan zaxira → tiklash → nazorat yig'indilari).
name: zanjir-deploy

on:
  pull_request:
    paths:
      - "zanjir/deploy/**"
      - "zanjir/server/**"
      - "zanjir/packages/zanjir_data/**"
      - ".github/workflows/zanjir-deploy.yml"
  workflow_dispatch:

concurrency:
  group: zanjir-deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck --severity=warning -x zanjir/deploy/zanjir zanjir/deploy/check-staging.sh zanjir/deploy/backup/*.sh zanjir/deploy/db/init/*.sh
      - name: compose konfiguratsiyasi (namuna muhitlar bilan)
        working-directory: zanjir/deploy
        run: |
          for e in staging prod; do
            sed -e 's/=@random$/=0123456789abcdef/' -e 's/=@age$/=age1example/' -e 's/=<[^>]*>$/=example/' \
              "environments/$e.env.example" > "/tmp/$e.env"
            docker compose -f compose.yaml --env-file "/tmp/$e.env" config --quiet
          done

  staging:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.8"
          channel: stable
          cache: true
      - run: dart pub get
        working-directory: zanjir/packages/zanjir_data
      - name: Staging qabul sinovi
        run: zanjir/deploy/check-staging.sh
      - name: Loglar (xato bo'lsa)
        if: failure()
        run: zanjir/deploy/zanjir logs staging
      - name: Tozalash
        if: always()
        run: docker compose --project-directory zanjir/deploy -f zanjir/deploy/compose.yaml -p zanjir-staging --env-file zanjir/deploy/environments/staging.env down -v || true
