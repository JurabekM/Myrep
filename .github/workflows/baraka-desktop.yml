name: baraka-desktop

on:
  push:
    paths: ['baraka_daftari/desktop/**', 'baraka_daftari/spec/**', '.github/workflows/baraka-desktop.yml']
  pull_request:
    paths: ['baraka_daftari/desktop/**', 'baraka_daftari/spec/**', '.github/workflows/baraka-desktop.yml']

defaults:
  run:
    working-directory: baraka_daftari/desktop

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux tizim kutubxonalari (Tauri)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: baraka_daftari/desktop

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: baraka_daftari/desktop/pnpm-lock.yaml

      - name: Frontend o'rnatish
        run: pnpm install --frozen-lockfile

      # Tauri generate_context! frontendDist mavjudligini talab qiladi, shuning uchun UI avval yig'iladi.
      - name: Frontend lint, format, test, build
        run: |
          pnpm --dir ui lint
          pnpm --dir ui format:check
          pnpm --dir ui test
          pnpm --dir ui build

      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace --exclude vectors
      # Mobil ilova CI'si ham aynan shu vektorlardan o'tishi shart.
      - name: test vektorlari
        run: cargo test -p vectors

      - name: TS bindinglar yangilangan (commit qilinganiga teng)
        shell: bash
        run: git diff --exit-code -- ui/src/bindings

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: money crate qamrovi ≥ 95%
        working-directory: baraka_daftari/desktop
        run: cargo llvm-cov -p money --fail-under-lines 95

  windows-installer:
    needs: verify
    runs-on: windows-latest
    defaults:
      run:
        working-directory: baraka_daftari/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: baraka_daftari/desktop
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: cargo install tauri-cli --version "^2" --locked
      - name: NSIS installer
        run: cargo tauri build --bundles nsis
        working-directory: baraka_daftari/desktop/src-tauri
      - uses: actions/upload-artifact@v4
        with:
          name: baraka-desktop-nsis
          path: baraka_daftari/desktop/target/release/bundle/nsis/*.exe
