# ZANJIR — Android release (12-faza, ADR-0016).
#  - `check` (har PR): texnik release build — bir martalik kalit, R8, Dart obfuskatsiyasi, AAB tekshiruvi. Artefakt
#    saqlanmaydi (bu AAB tarqatilmaydi).
#  - `release` (faqat qo'lda, `zanjir-v*` teg ustida): foydalanuvchi upload kaliti (repo secrets) bilan; normalar release
#    darvozasi va testlar `build_release.sh` ichida. Play'ga yuklashni foydalanuvchi qiladi — artefaktdan.
name: zanjir-release

on:
  pull_request:
    paths:
      - "zanjir/app/**"
      - "zanjir/packages/**"
      - "zanjir/norms/**"
      - ".github/workflows/zanjir-release.yml"
  workflow_dispatch:

concurrency:
  group: zanjir-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.8"

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "21"}
      - uses: subosito/flutter-action@v2
        with: {flutter-version: "${{ env.FLUTTER_VERSION }}", channel: stable, cache: true}
      - name: shellcheck
        run: shellcheck --severity=warning zanjir/app/tool/*.sh
      - name: Ikonkalar geometriyaga mos
        run: |
          python3 -m venv "$RUNNER_TEMP/icons"
          "$RUNNER_TEMP/icons/bin/pip" install --quiet pillow==12.3.0
          "$RUNNER_TEMP/icons/bin/python" -I zanjir/app/tool/gen_icons.py --check
      - run: flutter pub get
        working-directory: zanjir/app
      - name: Texnik release build (bir martalik kalit) + AAB tekshiruvi
        run: zanjir/app/tool/build_check.sh

  release:
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/zanjir-v')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: release   # himoyalangan muhit: tasdiq talab qilinadi (foydalanuvchi sozlaydi)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "21"}
      - uses: subosito/flutter-action@v2
        with: {flutter-version: "${{ env.FLUTTER_VERSION }}", channel: stable, cache: true}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pipx install uv
      - run: flutter pub get
        working-directory: zanjir/app
      - name: Upload kaliti (secrets → vaqtinchalik fayl)
        env:
          KEYSTORE_B64: ${{ secrets.ZANJIR_UPLOAD_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.ZANJIR_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ZANJIR_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ZANJIR_UPLOAD_KEY_PASSWORD }}
        run: |
          umask 077
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/upload.jks" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > zanjir/app/android/key.properties
      - name: Release AAB (darvozalar bilan)
        env:
          ZANJIR_SERVER_URL: ${{ vars.ZANJIR_SERVER_URL }}
        run: zanjir/app/tool/build_release.sh
      - name: Kalitni o'chirish
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks" zanjir/app/android/key.properties
      - uses: actions/upload-artifact@v4
        with:
          name: zanjir-aab
          retention-days: 14
          path: |
            zanjir/app/build/release/*/*.aab
            zanjir/app/build/release/*/mapping.txt
            zanjir/app/build/release/*/report.txt
            zanjir/app/build/release/*/release-info.txt
      - uses: actions/upload-artifact@v4
        with:
          name: zanjir-dart-symbols
          retention-days: 14
          path: zanjir/app/build/release/*/dart-symbols-*.tar.gz
