# ZANJIR — asosiy oqim integration testi Android emulyatorida (5-faza). Og'ir job: faqat ilova/paketlar o'zgarganda.
name: zanjir-emulator

on:
  pull_request:
    paths:
      - "zanjir/app/**"
      - "zanjir/packages/**"
      - ".github/workflows/zanjir-emulator.yml"
  workflow_dispatch:

concurrency:
  group: zanjir-emulator-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.8"
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: zanjir/app
      - name: integration_test (asosiy oqim)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          working-directory: zanjir/app
          script: flutter test integration_test --reporter expanded
