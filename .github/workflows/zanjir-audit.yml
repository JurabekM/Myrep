# ZANJIR bog'liqliklar auditi (ADR-0014): barcha lock-fayllar OSV.dev bazasida. Har hafta va lock o'zgarganda.
name: zanjir-audit

on:
  schedule:
    - cron: "17 3 * * 1"
  push:
    paths:
      - "zanjir/**/pubspec.lock"
      - "zanjir/**/uv.lock"
      - "zanjir/tools/audit/**"
      - ".github/workflows/zanjir-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  osv:
    name: OSV zaifliklar auditi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tahlilchi testlari (tarmoqsiz)
        run: python3 -m unittest discover -s zanjir/tools/audit -p "test_*.py"
      - name: Audit (ochiq zaiflik bo'lsa — yiqiladi)
        run: python3 -I zanjir/tools/audit/osv_audit.py
