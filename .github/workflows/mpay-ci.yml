# M-Pay Pay Sandbox CI: fmt, clippy, test, deny, audit va SoftHSM2 integratsion testi.
name: mpay-ci

on:
  push:
    paths: ["m-pay/**", ".github/workflows/mpay-ci.yml"]
  pull_request:
    paths: ["m-pay/**", ".github/workflows/mpay-ci.yml"]

defaults:
  run:
    working-directory: m-pay

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt + clippy + test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: m-pay
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  postgres:
    # 2-faza P2.3 (ADR-0018): Vault va butun e2e to'plami PostgreSQL'da (har test o'z bazasida).
    name: PostgreSQL integratsion testi
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: mpay
          POSTGRES_DB: mpay
          # Faqat shu job ichidagi vaqtinchalik baza — parol yo'q (repoga sir tushmaydi).
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mpay" --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: m-pay
      - run: cargo test -p mpay-vault -p mpay-e2e
        env:
          MPAY_TEST_PG_URL: postgres://mpay@127.0.0.1:5432/mpay

  softhsm:
    name: SoftHSM2 (PKCS#11) integratsion testi
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: m-pay
      - run: sudo apt-get update && sudo apt-get install -y softhsm2
      - name: SoftHSM token tayyorlash
        run: |
          mkdir -p "$RUNNER_TEMP/softhsm/tokens"
          echo "directories.tokendir = $RUNNER_TEMP/softhsm/tokens" > "$RUNNER_TEMP/softhsm/softhsm2.conf"
          echo "SOFTHSM2_CONF=$RUNNER_TEMP/softhsm/softhsm2.conf" >> "$GITHUB_ENV"
          export SOFTHSM2_CONF="$RUNNER_TEMP/softhsm/softhsm2.conf"
          PIN=$(openssl rand -hex 8)
          echo "::add-mask::$PIN"
          echo "MPAY_PKCS11_PIN=$PIN" >> "$GITHUB_ENV"
          softhsm2-util --init-token --free --label mpay-ci --so-pin "$(openssl rand -hex 8)" --pin "$PIN"
      - name: PKCS#11 testlari
        env:
          MPAY_PKCS11_LIB: /usr/lib/softhsm/libsofthsm2.so
          MPAY_PKCS11_TOKEN_LABEL: mpay-ci
        run: |
          cargo test -p mpay-crypto --features pkcs11 -- --include-ignored pkcs11
          cargo test -p mpay-e2e --features pkcs11 --test pkcs11_e2e -- --include-ignored

  smoke:
    name: Haqiqiy binarlar bilan smoke (init → serve → mpay-tsim)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: m-pay
      - run: bash scripts/smoke-e2e.sh
      - name: 10 daqiqalik bank namoyishi (avtomatik rejim)
        run: DEMO_AUTO=1 bash scripts/demo.sh

  deploy:
    name: docker-compose muhiti (nginx + 2 API + Shield + PostgreSQL + SoftHSM + Prometheus)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # Yuk nginx orqali, api-1 o'rtada to'xtatiladi, ogohlantirish, zaxira → tiklash → audit.
      - run: bash scripts/compose-test.sh 60 16

  kotlin:
    name: Kotlin (mpay-core testlari + Jazzer fuzzing)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: mpay-core testlari (Jazzer regressiya rejimi bilan)
        working-directory: m-pay/android
        run: ./gradlew --no-daemon :mpay-core:test
      - name: Jazzer fuzzing (har test o'z maxDuration'i)
        run: bash scripts/android-fuzz.sh
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: jazzer-findings
          path: |
            m-pay/android/mpay-core/crash-*
            m-pay/android/mpay-core/build/fuzz-logs

  fuzz:
    name: Fuzz (har maqsad 60 s)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: m-pay/fuzz
      - run: cargo install cargo-fuzz --locked
      - run: bash scripts/fuzz-campaign.sh 60
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: m-pay/fuzz/artifacts

  supply-chain:
    name: cargo deny + cargo audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: m-pay/Cargo.toml
      - uses: dtolnay/rust-toolchain@1.97.1
      - run: cargo install cargo-audit --locked
      - run: cargo audit
