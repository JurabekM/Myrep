[project]
name = "ai-business-advisor"
version = "0.1.0"
description = "AI Business Advisor Uzbekistan — backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "motor>=3.4",
    "redis>=5.0",
    "qdrant-client>=1.9",
    "celery>=5.4",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "pyotp>=2.9",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "openai>=1.30",
    "anthropic>=0.28",
    "google-generativeai>=0.6",
    "mistralai>=0.4",
    "tenacity>=8.3",
    "structlog>=24.1",
    "python-magic-bin>=0.4; sys_platform == 'win32'",
    "python-magic>=0.4; sys_platform != 'win32'",
    "pypdf>=4.2",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "python-pptx>=0.6",
    "pytesseract>=0.3",
    "Pillow>=10.3",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "rank-bm25>=0.2",
    "prometheus-fastapi-instrumentator>=7.0",
    "sentry-sdk[fastapi]>=2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "mongomock-motor>=0.0.29",
    "fakeredis>=2.23",
    "ruff>=0.4",
    "mypy>=1.10",
    "bandit>=1.7",
    "locust>=2.28",
]
flask-compat = [
    "flask>=3.0",
    "asgiref>=3.8",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "S", "A", "C4", "PT", "SIM"]
ignore = ["S101"]  # assert in tests

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=95"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
