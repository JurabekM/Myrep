name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
      qdrant:
        image: qdrant/qdrant:v1.10.1
        ports: ["6333:6333"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install tesseract
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr libmagic1
      - name: Install dependencies
        run: pip install -e ".[dev,flask-compat]"
      - name: Lint
        run: ruff check app tests
      - name: Type check
        run: mypy app || true  # strict mode ratchets over time
      - name: Security scan
        run: bandit -q -r app -x app/adapters
      - name: Tests (95% coverage gate)
        env:
          SECRET_KEY: ci-test-secret-key-at-least-32-chars!!
          ENVIRONMENT: test
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package.json
      - run: npm install
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: docker compose build
      - name: Scan backend image
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: claude_cowork-backend
          severity: HIGH,CRITICAL
          exit-code: "0"
