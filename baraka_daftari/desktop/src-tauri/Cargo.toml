[package]
name = "baraka-desktop"
description = "Baraka daftari Desktop — Oila kengashi va biznes stoli"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
specta = "=2.0.0-rc.25"
specta-typescript = "0.0.12"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
money = { path = "../crates/money" }
security = { path = "../crates/security" }
storage = { path = "../crates/storage" }
domain = { path = "../crates/domain" }
services = { path = "../crates/services" }
api = { path = "../crates/api" }
content = { path = "../crates/content" }
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
zeroize = "1"

# Testlar `api` crate ida. Tauri'ga bog'langan lib va ilova binary'sining test harness'i
# Windows'da ishlamaydi (0xc0000139), shuning uchun ular o'chirilgan.
[lib]
test = false
doctest = false

[[bin]]
name = "baraka-desktop"
path = "src/main.rs"
test = false

[[bin]]
name = "export-bindings"
path = "src/bin/export_bindings.rs"
test = false

[lints]
workspace = true
