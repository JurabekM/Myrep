[workspace]
resolver = "2"
members = ["crates/money", "crates/vectors", "crates/domain", "crates/content", "crates/security", "crates/storage", "crates/services", "src-tauri"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
proptest = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
float_arithmetic = "deny"
unwrap_used = "deny"
expect_used = "deny"
